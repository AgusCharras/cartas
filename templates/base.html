{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cartas Arg{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/game.css' %}?v=4">
</head>
<body>
  <div class="wrap {% block wrapclass %}{% endblock %}">
    <header class="top">
      <h1 class="logo"><a href="{% url 'game:home' %}">Cartas <span>Arg</span></a></h1>
      <nav><a href="{% url 'decks:list' %}">Mis mazos</a></nav>
    </header>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
