{% extends "base.html" %}
{% load static %}
{% block wrapclass %}wide{% endblock %}
{% block content %}

<div class="roombar">
  <div class="pill">Sala <strong class="code-sm">{{ game.code }}</strong></div>
  <div class="pill accent" id="round-pill">Lobby</div>
  <div class="pill" id="goal-pill" hidden></div>
  <div class="pill" id="status">Conectando…</div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="reveal" class="reveal" role="dialog" aria-live="polite" hidden></div>
<div id="confirm" class="confirmwrap" role="dialog" aria-modal="true" hidden></div>
<div id="robbed" class="reveal robbed" role="alert" hidden></div>
<div id="myopic" class="reveal robbed myopicalert" role="alert" hidden></div>
<div id="steal" class="reveal stealmodal" role="dialog" hidden></div>
<div id="podium" class="reveal podium" role="dialog" aria-live="polite" hidden></div>

<div class="layout">
  <section class="stage">
    <div id="result" hidden></div>
    <div id="main"></div>
  </section>

  <aside class="side" id="side">
    <button class="sideclose" id="sideclose" aria-label="Cerrar">✕</button>
    <div class="panel">
      <h3>Jugadores (<span id="pcount">0</span>)</h3>
      <ul id="players" class="plist"></ul>
      <div id="controls" class="ctrls"></div>
    </div>
    <div class="panel chat">
      <h3>Chat</h3>
      <div id="chatlog"></div>
      <form id="chatform" autocomplete="off">
        <input id="chatinput" maxlength="200" placeholder="Escribí un mensaje…">
        <button>➤</button>
      </form>
    </div>
  </aside>
</div>
<div id="sidebackdrop" class="backdrop" hidden></div>

{{ deck_options|json_script:"deck-options" }}

<script>
  const $ = (id) => document.getElementById(id);
  const inviteLink = location.origin + "{% url 'game:join' game.code %}";
  const deckOptions = JSON.parse($("deck-options").textContent);

  let ws = null, state = null, selected = [], selectedSub = null, toastTimer = null, pingTimer = null;
  let voteBannerRound = null;  // ronda en la que ya se animó el aviso de votación
  let codeDraft = "", selectDraft = "";  // para no perder lo escrito cuando llega un refresco

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // Siempre textContent: nunca innerHTML con texto de usuarios (evita XSS)
  function node(tag, text, cls) {
    const n = document.createElement(tag);
    if (text !== undefined) n.textContent = text;
    if (cls) n.className = cls;
    return n;
  }

  // Texto de una carta negra con cada "_" dibujado como un hueco subrayado
  function fillBlanks(card, text) {
    const t = node("span", undefined, "t");
    text.split(/_+/).forEach((part, i) => {
      if (i > 0) t.append(node("span", undefined, "blank"));
      t.append(document.createTextNode(part));
    });
    card.replaceChildren(t);
  }

  function cardNode(text, cls, onClick) {
    const n = node("div", text, "c " + cls);
    const kinds = cls.split(" ");
    if (kinds.includes("black") && typeof text === "string") fillBlanks(n, text);
    n.dataset.brand = kinds.includes("black") ? "Cartas Arg" : kinds.includes("gold") ? "ARG · dorada" : "ARG";
    if (onClick) { n.classList.add("clickable"); n.onclick = onClick; }
    return n;
  }

  // ---- ronda de descarte: la carta negra llega "encriptada" y se descifra al jugar todos ----
  // El servidor no manda el texto mientras se juega: lo que se ve acá es ruido puramente decorativo.
  const GLYPHS = "█▓▒░#@%&$*+=?/<>ΩΞΣ01";
  const DECRYPT_MS = 1700;
  let encRound = -1, encPattern = [], decryptRound = -1, decryptStart = 0;
  const glyph = () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)];

  function encPatternFor(round) {  // largo de palabras al azar: no tiene relación con el texto real
    if (encRound === round) return encPattern;
    encRound = round;
    encPattern = Array.from({ length: 5 + Math.floor(Math.random() * 3) }, () => 2 + Math.floor(Math.random() * 7));
    return encPattern;
  }

  function blackCardNode(s) {
    if (s.black.secret) {
      const n = cardNode("", "black encrypted");
      n.dataset.enc = "1";
      n.setAttribute("aria-label", "Carta negra secreta");
      encPatternFor(s.round);
      cryptEl(n);
      return n;
    }
    const n = cardNode(s.black.text, "black");
    if (s.blind_round && decryptRound === s.round && performance.now() - decryptStart < DECRYPT_MS) {
      n.classList.add("decrypting");
      n.dataset.real = s.black.text;
      cryptEl(n);
    }
    return n;
  }

  function cryptEl(el) {
    if (el.dataset.enc) {
      const t = el.querySelector(".t");
      if (t) t.textContent = encPattern.map((len) => Array.from({ length: len }, glyph).join("")).join(" ");
    } else if (el.dataset.real !== undefined) {
      const real = el.dataset.real;
      const k = Math.min(1, (performance.now() - decryptStart) / DECRYPT_MS);
      if (k >= 1) {  // listo: se vuelve a dibujar la carta normal (con sus huecos)
        delete el.dataset.real;
        el.classList.remove("decrypting");
        fillBlanks(el, real);
        return;
      }
      const chars = Array.from(real);
      const done = Math.floor(chars.length * k);
      const t = el.querySelector(".t");
      if (t) t.textContent = chars.map((c, i) => (i < done || c === " " ? c : glyph())).join("");
    }
  }

  function tickCrypt() {
    for (const el of document.querySelectorAll("[data-enc], [data-real]")) cryptEl(el);
  }
  setInterval(tickCrypt, 70);

  // ---- carta dorada: una por jugador y por partida, escrita por el propio jugador ----
  const GOLDEN_MAX = 140;
  let goldenText = "";       // borrador (sobrevive a los refrescos del estado)
  let focusGolden = false;   // enfocar el cuadro de texto justo después de elegirla
  let playBtn = null;

  // En la selección, la carta dorada se representa con "G" (las de la mano, con su id)
  function canPlay() {
    if (!state || !state.black) return false;
    if (state.me.robbed_by) return false;  // le están robando: no puede jugar
    if (selected.length !== state.black.pick) return false;
    return !selected.includes("G") || goldenText.trim().length >= 3;
  }

  function updateSend() {
    if (playBtn) playBtn.disabled = !canPlay();
  }

  function goldenCardNode(pick) {
    const idx = selected.indexOf("G");
    const on = idx >= 0;
    const n = node("div", undefined, "c gold clickable" + (on ? " selected" : ""));
    n.dataset.brand = "ARG · dorada";
    n.onclick = () => toggle("G", pick);
    const prefix = on && pick > 1 ? (idx + 1) + ". " : "";
    const stock = state && state.me.golden_left > 1 ? ` (${state.me.golden_left})` : "";
    const worth = state && state.golden_double ? " · x2" : "";
    n.append(node("div", prefix + "⭐ Carta dorada" + stock + worth, "gtitle"));
    if (on) {
      const ta = node("textarea");
      ta.id = "golden-input";
      ta.maxLength = GOLDEN_MAX;
      ta.placeholder = "Escribí tu carta…";
      ta.value = goldenText;
      ta.onclick = (e) => e.stopPropagation();  // escribir no deselecciona la carta
      ta.oninput = () => { goldenText = ta.value; updateSend(); };
      n.append(ta);
    } else {
      n.append(node("div", goldenText.trim() || "Escribí tu propia carta (1 por partida)", "ghint"));
    }
    return n;
  }

  // Diálogo de confirmación propio (reemplaza al confirm() del navegador). Devuelve una promesa true/false.
  let closeConfirm = null;
  function askConfirm({ icon = "❔", title, text, content, ok = "Aceptar", cancel = "Cancelar", tone = "ok" }) {
    return new Promise((resolve) => {
      if (closeConfirm) closeConfirm(false);
      const box = $("confirm");
      const finish = (v) => {
        document.removeEventListener("keydown", onKey, true);
        box.hidden = true;
        box.replaceChildren();
        closeConfirm = null;
        resolve(v);
      };
      const onKey = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); } };
      closeConfirm = finish;
      box.replaceChildren();
      const card = node("div", undefined, "confirmbox " + tone);
      card.append(node("div", icon, "confirmicon"), node("h3", title));
      if (text) card.append(node("p", text, "confirmtext"));
      if (content) card.append(content);
      const row = node("div", undefined, "confirmrow");
      const no = node("button", cancel, "ghostbtn confirmno");
      no.onclick = () => finish(false);
      const yes = node("button", ok, "confirmok");
      yes.onclick = () => finish(true);
      row.append(no, yes);
      card.append(row);
      box.append(card);
      box.onclick = (e) => { if (e.target === box) finish(false); };  // tocar afuera cancela
      box.hidden = false;
      document.addEventListener("keydown", onKey, true);
      yes.focus();
    });
  }

  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
  }

  // ---- avatares: emoji + color determinísticos a partir del apodo ----
  const AVATARS = window.CARTAS_AVATARS || ["🦆", "🐱", "🐶", "👽", "🦊", "🐸", "🐼", "🦉", "🐙", "🦄", "🐵", "🐢", "🦖", "🐧", "🐯", "🦁"];
  const avatarMap = new Map();  // apodo -> personaje que eligió (si no eligió, se le asigna uno según su apodo)
  function hash(str) {
    let h = 5381;
    for (const ch of str) h = ((h << 5) + h + ch.codePointAt(0)) | 0;
    return Math.abs(h);
  }
  function avatarNode(nick) {
    const chosen = avatarMap.get(nick);
    const n = node("div", chosen || AVATARS[hash(nick) % AVATARS.length], "avatar");
    n.style.background = `hsl(${hash(chosen || nick) % 360} 55% 38%)`;
    return n;
  }

  // Elegir otro personaje desde la sala (tocando el propio en la lista de jugadores)
  async function openAvatarPicker() {
    const mine = avatarMap.get(state.me.nickname) || null;
    const grid = node("div", undefined, "avgrid");
    const cells = AVATARS.map((e) => {
      const b = node("button", e, "avcell" + (e === mine ? " on" : ""));
      b.type = "button";
      b.onclick = () => {
        try { localStorage.setItem("cartasAvatar", e); } catch (err) { /* sin almacenamiento */ }
        avatarMap.set(state.me.nickname, e);
        cells.forEach((c) => c.classList.toggle("on", c === b));
        send({ action: "avatar", emoji: e });
      };
      grid.append(b);
      return b;
    });
    await askConfirm({ icon: "🎭", title: "Elegí tu personaje", content: grid, ok: "Listo", cancel: "Cerrar" });
  }

  // ---- ranking y chat como panel lateral en pantallas chicas ----
  let unread = 0;
  const narrow = () => window.matchMedia("(max-width: 960px)").matches;
  const sideIsOpen = () => $("side").classList.contains("open");
  function updateUnread() {
    for (const el of document.querySelectorAll(".chatbadge")) { el.textContent = String(unread); el.hidden = !unread; }
  }
  function openSide(which) {
    $("side").classList.add("open");
    $("sidebackdrop").hidden = false;
    document.body.classList.add("noscroll");
    if (which === "chat") { unread = 0; updateUnread(); $("side").scrollTop = $("side").scrollHeight; }
    else $("side").scrollTop = 0;
  }
  function closeSide() {
    $("side").classList.remove("open");
    $("sidebackdrop").hidden = true;
    document.body.classList.remove("noscroll");
  }
  $("sideclose").onclick = closeSide;
  $("sidebackdrop").onclick = closeSide;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSide(); });

  // ---- chat ----
  function addChat(nick, text) {
    if (narrow() && !sideIsOpen() && !(state && state.me.nickname === nick)) { unread++; updateUnread(); }
    const log = $("chatlog");
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    const row = node("div", undefined, "chatmsg");
    const who = node("b", nick + ":");
    who.style.color = `hsl(${hash(nick) % 360} 70% 72%)`;
    row.append(who, " ", document.createTextNode(text));
    log.append(row);
    while (log.children.length > 60) log.firstChild.remove();
    if (nearBottom) log.scrollTop = log.scrollHeight;
  }

  $("chatform").onsubmit = (e) => {
    e.preventDefault();
    const input = $("chatinput");
    const text = input.value.trim();
    if (!text) return;
    send({ action: "chat", text });
    input.value = "";
  };

  // ---- selección ----
  function toggle(id, pick) {
    const i = selected.indexOf(id);
    if (i >= 0) selected.splice(i, 1);
    else { selected.push(id); if (selected.length > pick) selected.shift(); }
    focusGolden = id === "G" && selected.includes("G");
    if (!refreshSelection()) renderMain(state);
  }

  // Cambia la selección SIN redibujar la mano: así las cartas suben y bajan con transición.
  // Devuelve false si hay que redibujar (la dorada cambia de forma: aparece su cuadro de texto).
  let rollBtn = null;
  const rollDisabled = (s) => (s.me.rerolls_left ?? 0) <= 0 || selected.length !== 1 || selected[0] === "G" || !!s.me.robbed_by;
  function refreshSelection() {
    const s = state;
    if (!s || s.state !== "playing") return false;
    const els = [...document.querySelectorAll(".fan .c.fc")];
    if (!els.length) return false;
    const gold = els.find((e) => e.classList.contains("gold"));
    if (gold && (gold.classList.contains("selected") || selected.includes("G"))) return false;
    const pick = s.black.pick;
    const texts = new Map(s.me.hand.map((c) => [c.id, c.text]));
    els.forEach((el, i) => {
      if (el === gold) return;
      const cid = Number(el.dataset.cid);
      const idx = selected.indexOf(cid);
      el.classList.toggle("selected", idx >= 0);
      el.textContent = idx >= 0 && pick > 1 ? `${idx + 1}. ${texts.get(cid)}` : texts.get(cid);
      el.style.zIndex = idx >= 0 ? "60" : String(i + 1);
    });
    updateSend();
    if (rollBtn) rollBtn.disabled = rollDisabled(s);
    return true;
  }

  // ---- render ----
  // ---- animación del +1 cuando alguien suma un punto ----
  const CELEBRATE_MS = 1800;
  let prevScores = null;     // id -> puntos de la última vez (null hasta recibir el primer estado)
  const celebrating = {};    // id -> momento en que empezó la animación
  let shownRound = null;

  function trackScores(s) {
    if (prevScores) {
      for (const p of s.players) {
        if (prevScores[p.id] !== undefined && p.score > prevScores[p.id]) {
          // se anima al cerrarse la revelación (ver closeReveal); se guarda cuántos puntos sumó
          pendingCelebrate.set(p.id, p.score - prevScores[p.id]);
        }
      }
    }
    prevScores = Object.fromEntries(s.players.map((p) => [p.id, p.score]));
  }

  // ---- revelación de la carta ganadora ----
  const REVEAL_SECONDS = 5;
  const pendingCelebrate = new Map();  // jugador -> puntos que sumó: se anima al cerrarse la revelación
  const celebrateDelta = {};           // jugador -> puntos que muestra el "+N" flotante
  let revealTimer = null;

  function flushCelebrate() {
    for (const [id, delta] of pendingCelebrate) {
      celebrating[id] = performance.now();
      celebrateDelta[id] = delta;
    }
    pendingCelebrate.clear();
  }

  function closeReveal() {
    clearInterval(revealTimer);
    revealTimer = null;
    clearTimeout(lottoTimer);
    lottoTimer = null;
    const box = $("reveal");
    if (box.hidden) return;
    box.hidden = true;
    box.replaceChildren();
    flushCelebrate();
    if (state) renderPlayers(state);  // ahora sí se ve el +1 en el tablero
    if (podiumPending && state) {     // la partida terminó: después de la revelación viene el podio
      podiumPending = false;
      showPodium(state);
    }
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closePodium(); closeReveal(); }
  });

  // ---- sorteo animado: un foco salta entre los empatados, frena de a poco y cae en el ganador ----
  let lottoTimer = null;

  function runLottery(box, names, winner, done) {
    const wrap = node("div", undefined, "lotto");
    wrap.append(node("div", "🎲 ¡Empate! Sorteo…", "lottotitle"));
    const row = node("div", undefined, "lottorow");
    const chips = names.map((n) => {
      const c = node("div", undefined, "lottochip");
      c.append(avatarNode(n), node("span", n));
      row.append(c);
      return c;
    });
    const res = node("div", "", "lottores");
    wrap.append(row, res);
    box.append(wrap);
    const n = names.length;
    const win = Math.max(0, names.indexOf(winner));
    const steps = Math.ceil(16 / n) * n + win;  // da varias vueltas y termina justo en el ganador
    let i = 0;
    const tick = () => {
      chips.forEach((c, k) => c.classList.toggle("on", k === i % n));
      if (i >= steps) {
        chips[win].classList.remove("on");
        chips[win].classList.add("won");
        res.textContent = "¡" + winner + "!";
        lottoTimer = setTimeout(() => {
          wrap.classList.add("out");
          lottoTimer = setTimeout(() => { wrap.remove(); done(); }, 450);
        }, 1100);
        return;
      }
      const delay = 70 + Math.pow(i / steps, 3) * 420;  // arranca rápido y se va frenando
      i += 1;
      lottoTimer = setTimeout(tick, delay);
    };
    tick();
  }

  function startCountdown(count, label, seconds = REVEAL_SECONDS) {
    let left = seconds;
    const paint = () => { count.textContent = `${label} ${left}…`; };
    paint();
    revealTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) closeReveal();
      else paint();
    }, 1000);
  }

  function revealBackdrop(box) {
    box.hidden = false;
    box.replaceChildren();
    box.onclick = closeReveal;  // tocar la pantalla la saltea
    // Fondo: cartas fantasma y destellos
    [[4, 12, -18], [20, 70, 12], [44, 6, 8], [62, 78, -10], [80, 10, 20], [90, 62, -14]].forEach(([x, y, r]) => {
      const g = node("div", undefined, "ghostcard");
      g.style.left = x + "%";
      g.style.top = y + "%";
      g.style.transform = `rotate(${r}deg)`;
      box.append(g);
    });
    ["12% 22%", "50% 10%", "88% 24%", "8% 64%", "92% 68%", "48% 88%"].forEach((pos, i) => {
      const [x, y] = pos.split(" ");
      const sp = node("span", "✦", "sparkle");
      sp.style.left = x;
      sp.style.top = y;
      sp.style.animationDelay = (i * 0.35) + "s";
      box.append(sp);
    });
  }

  // Resultado de un duelo del versus: las dos jugadas, el marcador y quién ganó
  function showDuelReveal(d, black, finished) {
    closeReveal();
    const box = $("reveal");
    revealBackdrop(box);
    const begin = () => {
      const stage = node("div", undefined, "reveal-stage versusreveal");
      stage.append(cardNode(black, "black"));
      const isMe = !!state && state.me.nickname === d.winner_name;
      const center = node("div", undefined, "reveal-center");
      const badge = node("div", undefined, "badge");
      badge.append(avatarNode(d.winner_name));
      const txt = node("div");
      txt.append(node("div", "⚔️ Ganó el duelo:", "badge-label"));
      txt.append(node("div", isMe ? d.winner_name + " (vos) 🎉" : d.winner_name, "badge-name"));
      txt.append(node("div", d.walkover ? `${d.loser_name} no jugó` : `🗳️ ${d.votes}–${d.loser_votes}` + (d.tie ? " · desempate por sorteo 🎲" : ""), "badge-votes"));
      if (d.points > 1) txt.append(node("div", "⭐ ¡Carta dorada: vale " + d.points + " puntos!", "badge-bonus"));
      badge.append(txt);
      const count = node("div", undefined, "countpill");
      center.append(node("div", "👑", "crown"), badge, count);
      const sides = node("div", undefined, "dsides");
      const side = (name, cards, golds, win) => {
        const el = node("div", undefined, "dside " + (win ? "win" : "lose"));
        el.append(node("div", (win ? "👑 " : "") + name, "dsname"));
        const row = node("div", undefined, "duelcards");
        cards.forEach((t, i) => row.append(cardNode(t, "white mini" + (golds[i] ? " gold" : ""))));
        el.append(row);
        return el;
      };
      sides.append(side(d.winner_name, d.cards, d.golden || [], true));
      if (d.loser_cards && d.loser_cards.length) sides.append(side(d.loser_name, d.loser_cards, d.loser_golden || [], false));
      stage.append(center, sides);
      box.append(stage);
      startCountdown(count, finished ? "Resultados en" : "Sigue en");
    };
    if (d.tie) runLottery(box, [d.winner_name, d.loser_name].sort(() => 0.5 - Math.random()), d.winner_name, begin);
    else begin();
  }

  function showReveal(l, finished) {
    if (l.mode === "versus") {
      showDuelReveal(l.duels[l.duels.length - 1], l.black, finished);
      return;
    }
    closeReveal();
    const box = $("reveal");
    revealBackdrop(box);
    const begin = () => {
      const stage = node("div", undefined, "reveal-stage");
      stage.append(cardNode(l.black, "black"));

      // Centro: corona, quién ganó y cuenta regresiva
      const isMe = !!state && state.me.nickname === l.winner;
      const center = node("div", undefined, "reveal-center");
      const badge = node("div", undefined, "badge");
      badge.append(avatarNode(l.winner));
      const txt = node("div");
      txt.append(node("div", l.mode === "vote" ? "La jugada más votada fue de:" : "La carta fue elegida por:", "badge-label"));
      txt.append(node("div", isMe ? l.winner + " (vos) 🎉" : l.winner, "badge-name"));
      if (l.mode === "vote") {
        txt.append(node("div", "🗳️ " + l.votes + (l.votes === 1 ? " voto" : " votos") + (l.tie ? " · desempate por sorteo 🎲" : ""), "badge-votes"));
      }
      if (l.points > 1) txt.append(node("div", "⭐ ¡Carta dorada: vale " + l.points + " puntos!", "badge-bonus"));
      badge.append(txt);
      const count = node("div", undefined, "countpill");
      center.append(node("div", "👑", "crown"), badge, count);
      stage.append(center);

      // Respuesta ganadora (acá sí se revela si era dorada: el juez ya eligió)
      const whites = node("div", undefined, "reveal-whites");
      l.cards.forEach((t, i) =>
        whites.append(cardNode(t, "white" + (l.golden && l.golden[i] ? " gold" : ""))));
      stage.append(whites);
      box.append(stage);
      startCountdown(count, finished ? "Resultados en" : "Siguiente ronda en");
    };
    if (l.tie && l.tied && l.tied.length > 1) runLottery(box, l.tied, l.winner, begin);
    else begin();
  }

  // ---- podio final ----
  let podiumPending = false;  // la partida terminó mientras se mostraba la revelación de la última ronda

  function closePodium() {
    const box = $("podium");
    if (box.hidden) return;
    box.hidden = true;
    box.replaceChildren();
  }

  // Puestos con empates: 1, 1, 3 (dos jugadores con el mismo puntaje comparten el puesto)
  function rankPlayers(players) {
    const sorted = [...players].sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    return sorted.map((p) => ({ p, rank: 1 + sorted.filter((q) => q.score > p.score).length }));
  }

  function showPodium(s) {
    closePodium();
    const box = $("podium");
    box.hidden = false;
    box.replaceChildren();
    box.onclick = closePodium;

    // Confeti y destellos (solo decoración)
    const colors = ["#6fd39a", "#f5c542", "#ff6b6b", "#7cc4ff", "#ffffff", "#c792ea"];
    for (let i = 0; i < 60; i++) {
      const c = node("span", undefined, "confetti");
      c.style.left = (Math.random() * 100).toFixed(1) + "%";
      c.style.background = colors[i % colors.length];
      c.style.setProperty("--t", (3 + Math.random() * 3).toFixed(2) + "s");
      c.style.setProperty("--d", (Math.random() * 3).toFixed(2) + "s");
      box.append(c);
    }
    ["10% 20%", "50% 8%", "90% 22%", "6% 62%", "94% 66%"].forEach((pos, i) => {
      const [x, y] = pos.split(" ");
      const sp = node("span", "✦", "sparkle");
      sp.style.left = x;
      sp.style.top = y;
      sp.style.animationDelay = (i * 0.4) + "s";
      box.append(sp);
    });

    const ranked = rankPlayers(s.players);
    const winners = ranked.filter((e) => e.rank === 1).map((e) => e.p.nickname);
    const iWon = winners.includes(s.me.nickname);

    const stage = node("div", undefined, "podium-stage");
    const title = node("div", undefined, "podium-title");
    title.append(node("div", "🏆 ¡Fin de la partida!"));
    title.append(node("div",
      iWon ? "¡Ganaste! 🎉" : winners.length > 1 ? "Empate: " + winners.join(" y ") : "¡Ganó " + winners[0] + "!",
      "podium-sub"));
    stage.append(title);

    // Podio: 2.º a la izquierda, 1.º en el centro, 3.º a la derecha
    const top = ranked.slice(0, 3);
    const order = [top[1], top[0], top[2]].filter(Boolean);
    const delays = { 1: [1.5, 2.2], 2: [0.9, 1.6], 3: [0.3, 1.0] };  // [sube el bloque, aparece la persona]
    const podium = node("div", undefined, "podiumrow");
    order.forEach(({ p, rank }) => {
      const [bd, wd] = delays[rank];
      const col = node("div", undefined, "pcol rank" + rank);
      const who = node("div", undefined, "pwho");
      who.style.setProperty("--wd", wd + "s");
      if (rank === 1) {
        const crown = node("div", "👑", "pcrown");
        crown.style.setProperty("--cd", (wd + 0.5).toFixed(1) + "s");
        who.append(crown);
      }
      who.append(avatarNode(p.nickname), node("div", p.nickname, "podname"), node("div", p.score + " pts", "podpts"));
      const block = node("div", String(rank), "pblock");
      block.style.setProperty("--bd", bd + "s");
      col.append(who, block);
      podium.append(col);
    });
    stage.append(podium);

    const btn = node("button", "Ver resultados", "bigbtn podium-btn");
    btn.onclick = closePodium;
    stage.append(btn);
    box.append(stage);
  }

  // El aviso del último ganador se puede minimizar (queda un chip chico) y se recuerda en este navegador
  let resultMin = false;
  try { resultMin = localStorage.getItem("resultMin") === "1"; } catch (e) { /* sin almacenamiento: se muestra siempre */ }
  function setResultMin(v) {
    resultMin = v;
    try { localStorage.setItem("resultMin", v ? "1" : "0"); } catch (e) { /* idem */ }
    if (state) renderResult(state, false);
  }

  function renderResult(s, first) {
    const r = $("result");
    if (!s.last_result || s.state === "lobby") { r.hidden = true; return; }
    const l = s.last_result;
    r.hidden = false;
    r.classList.toggle("min", resultMin);
    r.replaceChildren();
    if (resultMin) {
      const chip = node("button", `🏆 Ronda ${l.round}: ${l.mode === "versus" ? "ganaron" : "ganó"} ${l.winner}`, "reschip");
      chip.title = "Mostrar el detalle del último ganador";
      chip.onclick = () => setResultMin(false);
      r.append(chip);
    } else {
      const txt = l.mode === "versus"
        ? `⚔️ Ronda ${l.round} (versus): ` + l.duels.map((d) => `${d.winner_name} le ganó a ${d.loser_name} (${d.votes}–${d.loser_votes})`).join(" · ")
        : `🏆 Ronda ${l.round}: ganó ${l.winner}. «${l.black}» → ${l.cards.map((t, i) => (l.golden && l.golden[i] ? "⭐ " : "") + t).join(" / ")}`
        + (l.mode === "vote" ? ` · 🗳️ ${l.votes} voto${l.votes === 1 ? "" : "s"}${l.tie ? " (desempate por sorteo)" : ""}` : "");
      const min = node("button", "—", "resmin");
      min.title = "Minimizar";
      min.setAttribute("aria-label", "Minimizar el último ganador");
      min.onclick = () => setResultMin(true);
      r.append(node("span", txt, "restext"), min);
    }
    if (l.round !== shownRound) {
      shownRound = l.round;
      if (!first) {  // al entrar o recargar no se anima
        r.classList.remove("pop");
        void r.offsetWidth;  // reinicia la animación
        r.classList.add("pop");
        showReveal(l, s.state === "finished");
      }
    }
  }

  // ---- robo de cartas: se elige una carta boca abajo del rival, sin ver su contenido ----
  // Al tocar a la víctima se la bloquea (no puede jugar y ve un aviso) hasta que el ladrón elige,
  // cancela o se le acaba el tiempo (el servidor es quien manda; esto es solo la parte visual).
  const STEAL_SECONDS = 20;
  let stealTarget = null, stealUntil = 0, stealTimer = null;
  let lockUntil = 0, lockTimer = null;

  function canSteal(s) {
    return s.state === "playing" && !s.blind_round && (s.steals_per_player ?? 0) > 0 && (s.me.steals_left ?? 0) > 0
      && !s.me.has_played && !s.me.robbed_by && (!s.me.is_judge || s.vote_round)
      && (!s.versus_round || s.me.in_duel_self);
  }

  function canStealFrom(s, p) {
    return canSteal(s) && p.id !== s.me.id && !p.robbed && !p.has_played && !p.being_robbed
      && (s.hand_counts?.[p.id] ?? p.hand_count ?? 0) > 0 && (!p.is_judge || s.vote_round) && (!s.versus_round || p.in_duel);
  }

  function startSteal(p) {
    stealTarget = p.id;
    stealUntil = Date.now() + STEAL_SECONDS * 1000;
    clearTimeout(stealTimer);
    stealTimer = setTimeout(() => {
      if (stealTarget !== null) { showToast("Se acabó el tiempo para robar."); closeSteal(true); }
    }, STEAL_SECONDS * 1000);
    send({ action: "steal_start", player: p.id });
    renderSteal(state, true);
  }

  // cancel = avisar al servidor para desbloquear a la víctima
  function closeSteal(cancel) {
    if (cancel && stealTarget !== null) send({ action: "steal_cancel" });
    stealTarget = null;
    clearTimeout(stealTimer);
    $("steal").hidden = true;
  }

  function renderSteal(s, justOpened) {
    const box = $("steal");
    if (stealTarget === null) {
      if (pickerOpen) renderStealPicker(s);
      else if (myopicOpen) renderMyopicPicker(s);
      return;
    }
    const p = s.players.find((x) => x.id === stealTarget);
    const ok = p && canSteal(s) && !p.has_played && (p.robbing_me || justOpened)
      && (s.hand_counts?.[p.id] ?? p.hand_count ?? 0) > 0;
    if (!ok) { if (stealTarget !== null) closeSteal(false); return; }
    const n = s.hand_counts?.[p.id] ?? p.hand_count ?? 0;
    box.hidden = false;
    box.replaceChildren();
    const card = node("div", undefined, "stealbox");
    card.append(node("h3", `🦹 Robarle una carta a ${p.nickname}`));
    card.append(node("p", `Elegí una carta boca abajo, no podés ver qué dice. Tenés ${STEAL_SECONDS} segundos. `
      + `Te quedan ${s.me.steals_left} robo${s.me.steals_left === 1 ? "" : "s"}.`, "hint"));
    const row = node("div", undefined, "stealcards");
    for (let i = 0; i < n; i++) {
      const c = cardNode("", "back stealcard");
      c.classList.add("clickable");
      c.onclick = () => { send({ action: "steal", player: p.id, slot: i }); closeSteal(false); };
      row.append(c);
    }
    card.append(row);
    const cancel = node("button", "Cancelar", "ghostbtn");
    cancel.onclick = () => closeSteal(true);
    card.append(cancel);
    box.append(card);
  }

  // Pantalla para quien está siendo robado: se muestra mientras el servidor lo tenga bloqueado
  function renderRobbed(s) {
    const box = $("robbed");
    const by = s.me.robbed_by;
    clearTimeout(lockTimer);
    if (!by) { box.hidden = true; lockUntil = 0; return; }
    lockUntil = Date.now() + (s.me.lock_left ?? 20) * 1000;
    // Por si el ladrón se desconecta: el bloqueo vence solo en el servidor, acá se oculta a la par
    lockTimer = setTimeout(() => { if (state) { state.me.robbed_by = null; renderRobbed(state); renderMain(state); } },
                           Math.max(0, lockUntil - Date.now()) + 300);
    if (box.dataset.by === by && !box.hidden) return;  // ya está visible: no se reinicia la animación
    box.dataset.by = by;
    box.replaceChildren();
    const inner = node("div", undefined, "robbedbox");
    inner.append(node("div", "🦹", "robbedicon"));
    inner.append(node("h2", "¡Te están choreando!!"));
    inner.append(node("p", `${by} te está robando una carta. No podés jugar hasta que termine.`));
    box.append(inner);
    box.hidden = false;
  }

  function renderPlayers(s) {
    $("pcount").textContent = s.players.length;
    const ul = $("players");

    // Posición de cada fila antes de redibujar (respecto del borde de la lista), para animar el cambio de orden
    const before = {};
    const o0 = ul.getBoundingClientRect().top;
    for (const row of ul.children) before[row.dataset.pid] = row.getBoundingClientRect().top - o0;

    // En partida se ordena por puntaje (a igual puntaje, por orden de entrada).
    // Mientras se muestra la revelación de la ronda, el ganador cuenta con su puntaje anterior:
    // así el cambio de lugar y el "match point" se ven recién cuando se cierra (ver closeReveal).
    const inGame = s.state !== "lobby";
    const eff = (p) => (pendingCelebrate.has(p.id) ? p.score - pendingCelebrate.get(p.id) : p.score);
    const list = inGame ? [...s.players].sort((a, b) => eff(b) - eff(a)) : s.players;
    const goal = s.points_to_win;

    ul.replaceChildren();
    for (const p of list) {
      // Match point: le falta un punto para ganar (solo mientras la partida sigue en juego)
      const matchPoint = inGame && s.state !== "finished" && goal > 1 && eff(p) === goal - 1;
      const li = node("li", undefined, "prow" + (p.online ? "" : " offline") + (matchPoint ? " matchpoint" : ""));
      li.dataset.pid = p.id;
      const av = avatarNode(p.nickname);
      if (p.id === s.me.id) {
        av.classList.add("editable");
        av.title = "Cambiar mi personaje";
        av.onclick = openAvatarPicker;
      }
      li.append(av);

      const name = node("div", undefined, "pname");
      name.append(node("span", p.nickname + (p.id === s.me.id ? " (vos)" : "")));
      if (p.is_host) name.append(node("span", " 👑"));
      if (p.is_judge && s.state !== "lobby") name.append(node("span", " ⚖️"));
      if (s.state === "playing" && p.myopic && !p.has_played) name.append(node("span", " 👓"));
      if (s.state === "playing" && s.versus_round && p.in_duel) name.append(node("span", " ⚔️"));
      if (s.state === "playing" && !p.is_judge && (!s.versus_round || p.in_duel)) name.append(node("span", p.has_played ? " ✅" : " ⏳"));
      if (s.state === "judging" && s.vote_round) {
        name.append(node("span", p.in_duel ? " ⚔️" : p.has_voted ? " ✅" : " ⏳"));
      }
      if (!p.online) name.append(node("span", " 🔌"));
      if (matchPoint) name.append(node("div", "⚡ MATCH POINT", "mp-tag"));
      li.append(name);

      if (canStealFrom(s, p)) {
        const st = node("button", "🦹", "stealbtn");
        st.title = `Robarle una carta a ${p.nickname}`;
        st.onclick = () => startSteal(p);
        li.append(st);
      } else if (s.state === "playing" && (p.robbed || p.being_robbed)) {
        li.append(node("span", p.being_robbed ? "🦹" : "🚫", "robbedtag"));
      }
      if (s.me.is_host && p.id !== s.me.id && s.state !== "finished") {
        const k = node("button", "✕", "kick");
        k.title = `Expulsar a ${p.nickname}`;
        k.onclick = async () => {
          const yes = await askConfirm({ icon: "🚪", title: `¿Expulsar a ${p.nickname}?`,
            text: "Sale de la sala y no puede volver con ese mismo jugador.", ok: "Expulsar", tone: "danger" });
          if (yes) send({ action: "kick", player: p.id });
        };
        li.append(k);
      }
      const scoreEl = node("div", String(p.score), "score");
      const started = celebrating[p.id];
      if (started !== undefined) {
        const elapsed = performance.now() - started;
        if (elapsed < CELEBRATE_MS) {
          // Como la lista se redibuja en cada refresco, la animación se reanuda
          // desde donde iba (delay negativo) en vez de arrancar de cero.
          li.classList.add("scored");
          li.style.setProperty("--d", `-${Math.round(elapsed)}ms`);
          scoreEl.append(node("span", "+" + (celebrateDelta[p.id] || 1), "plus"));
        } else {
          delete celebrating[p.id];
        }
      }
      li.append(scoreEl);
      ul.append(li);
    }

    // Reordenamiento animado: cada fila arranca donde estaba y se desliza a su lugar nuevo.
    // Si justo se mostró un +1, se espera un instante para que se note antes de moverse.
    const o1 = ul.getBoundingClientRect().top;
    const wait = Math.max(0, ...Object.values(celebrating).map((t) => 700 - (performance.now() - t)));
    for (const row of ul.children) {
      const was = before[row.dataset.pid];
      if (was === undefined) continue;  // jugador nuevo: no hay de dónde venir
      const dy = was - (row.getBoundingClientRect().top - o1);
      if (Math.abs(dy) < 1) continue;
      row.style.transition = "none";
      row.style.transform = `translateY(${dy}px)`;
      void row.offsetHeight;  // fija la posición de partida antes de animar
      row.style.transition = `transform .6s cubic-bezier(.2, .8, .2, 1) ${Math.round(wait)}ms`;
      row.style.transform = "";
    }
  }

  function renderControls(s) {
    const box = $("controls");
    box.replaceChildren();

    const host = s.players.find((p) => p.is_host);
    if (!s.me.is_host && host && !host.online) {
      const b = node("button", "El host se desconectó: tomar el rol");
      b.onclick = () => send({ action: "claim_host" });
      box.append(b);
    }
    if (s.me.is_host && (s.state === "playing" || s.state === "judging")) {
      const b = node("button", s.vote_round ? "Cancelar ronda" : "Saltear al juez");
      b.onclick = async () => {
        const yes = await askConfirm({ icon: "⏭️", title: s.vote_round ? "¿Cancelar la ronda?" : "¿Saltear al juez?",
          text: s.vote_round ? "Se cancela la ronda y se vuelve a empezar con otra carta negra."
                             : "Se cancela la ronda y pasa a otro juez.",
          ok: s.vote_round ? "Cancelar ronda" : "Saltear", cancel: "Volver", tone: "danger" });
        if (yes) send({ action: "skip_judge" });
      };
      box.append(b);
    }
    if (s.me.is_host && s.state === "judging" && s.vote_round && s.votes_cast > 0) {
      const b = node("button", "Cerrar votación");
      b.onclick = async () => {
        const yes = await askConfirm({ icon: "🗳️", title: "¿Cerrar la votación?",
          text: "Se cuentan los votos que hay y gana la jugada más votada.", ok: "Cerrar votación", cancel: "Seguir votando" });
        if (yes) send({ action: "close_vote" });
      };
      box.append(b);
    }
    if (s.me.is_host && s.state === "playing" && s.players.some((p) => p.has_played)) {
      const b = node("button", "Seguir sin los que faltan");
      b.onclick = () => send({ action: "force_judging" });
      box.append(b);
    }
    const leave = node("button", "Salir de la sala");
    leave.onclick = async () => {
      const yes = await askConfirm({ icon: "👋", title: "¿Salir de la sala?",
        text: "Dejás la partida y tu lugar queda libre.", ok: "Salir", cancel: "Quedarme", tone: "danger" });
      if (yes) send({ action: "leave" });
    };
    box.append(leave);
  }

  // ---- reglas de la partida (el host las cambia en el lobby; los demás las ven) ----
  const RANGES = { points_to_win: [1, 20], rerolls: [0, 10], golden: [0, 5], vote_chance: [5, 95], steals: [0, 5], blind_chance: [0, 100], versus_chance: [0, 100], myopic: [0, 5] };  // igual que en el servidor

  function setRule(values) {
    send({ action: "settings", values });
  }

  // ---- sala de espera: modo de juego + tarjetas de habilidades + mazos ----
  // Si existe static/img/skills/<clave>.svg (o .png) se usa como dibujo de la tarjeta; si no, el emoji.
  const SKILL_IMG_DIR = "{% static 'img/mascot.svg' %}".replace(/[^/]*$/, "skills/");
  const skillImg = new Map();  // clave -> "svg" | "png" | "none" (se aprende al cargar, para no reintentar en cada refresco)
  let openTip = null;          // tarjeta cuya ayuda («!») está abierta

  const SKILLS = [
    { key: "points", icon: "🎯", label: "Puntos para ganar", field: "points_to_win", range: "points_to_win",
      tip: "Cuántos puntos hacen falta para ganar la partida. Con pocos puntos la partida es corta; con muchos, más larga." },
    { key: "golden", icon: "⭐", label: "Cartas doradas", field: "golden_per_player", range: "golden",
      tip: "Cada jugador puede escribir su propia carta y jugarla como una respuesta más. El juez no sabe cuál es la dorada hasta que elige ganadora. "
         + "Con «vale 2 puntos», ganar con una dorada suma el doble." },
    { key: "steals", icon: "🦹", label: "Robos", field: "steals_per_player", range: "steals",
      tip: "Elegís a un jugador y le robás una carta sin ver qué dice, antes de que juegue. Mientras lo robás, esa persona no puede jugar. "
         + "A cada jugador solo se le puede robar una vez por ronda." },
    { key: "rerolls", icon: "🔄", label: "Rerolleos", field: "rerolls_per_player", range: "rerolls",
      tip: "Descartás una carta de tu mano y recibís otra al azar. Sirve cuando ninguna te queda bien con la carta negra." },
    { key: "blind", icon: "🕶️", label: "Rondas de descarte", field: "blind_chance", range: "blind_chance", unit: "%", step: 5,
      tip: "En ese porcentaje de rondas la carta negra es secreta: todos juegan la carta que menos les importe perder, "
         + "después se revela y se vota entre todos. En esas rondas no hay dorada, rerolleos ni robos." },
    { key: "myopic", icon: "👓", label: "Miopes", field: "myopic_per_player", range: "myopic",
      tip: "Elegís a un jugador y le nublás la vista: durante esa ronda ve sus cartas borrosas y en otro orden, hasta que juegue. "
         + "Hay que hacerlo antes de que juegue, y a cada jugador solo se le puede nublar una vez por ronda. "
         + "No funciona en rondas de descarte ni con el juez." },
    { key: "versus", icon: "⚔️", label: "Versus", field: "versus_chance", range: "versus_chance", unit: "%", step: 5,
      tip: "En ese porcentaje de rondas se juegan duelos 1 contra 1: las parejas se arman al azar y se enfrentan de a una. En cada duelo "
         + "los dos eligen carta y votan todos los demás. El ganador de cada duelo suma un punto. Solo se activa con cantidad PAR de jugadores (mínimo 4) "
         + "y si nadie está en match point." },
  ];

  const MODES = [
    ["classic", "Clásico", 0, "En cada ronda un jugador hace de juez: lee las respuestas y elige la mejor."],
    ["random", "Sorpresa", 25, "Es como el clásico, pero en algunas rondas al azar no hay juez: todos juegan y todos votan la mejor. Nadie puede votar su propia carta."],
    ["always", "Sin juez", 100, "No hay juez: en todas las rondas todos juegan y todos votan. Nadie puede votar su propia carta; si hay empate, se sortea."],
  ];

  function skillIconNode(sk) {
    const wrap = node("div", undefined, "skillicon");
    const known = skillImg.get(sk.key);
    if (known === "none") { wrap.append(node("span", sk.icon, "skillemoji")); return wrap; }
    const img = node("img");
    img.alt = "";
    img.src = SKILL_IMG_DIR + sk.key + "." + (known || "svg");
    img.onload = () => { if (!known) skillImg.set(sk.key, img.src.endsWith(".png") ? "png" : "svg"); };
    img.onerror = () => {
      if (img.src.endsWith(".svg") && !known) { img.src = SKILL_IMG_DIR + sk.key + ".png"; return; }
      skillImg.set(sk.key, "none");
      img.replaceWith(node("span", sk.icon, "skillemoji"));
    };
    wrap.append(img);
    return wrap;
  }

  // ◀ valor ▶ (solo el host cambia valores)
  function triStepper(s, key, value, unit, step = 1) {
    const ctl = node("div", undefined, "tristep");
    const [min, max] = RANGES[key];
    if (s.me.is_host) {
      const l = node("button", "◀", "tri");
      l.setAttribute("aria-label", "Menos");
      l.disabled = value - step < min;
      l.onclick = () => setRule({ [key]: value - step });
      ctl.append(l);
    }
    ctl.append(node("div", value + (unit || ""), "trivalue"));
    if (s.me.is_host) {
      const r = node("button", "▶", "tri");
      r.setAttribute("aria-label", "Más");
      r.disabled = value + step > max;
      r.onclick = () => setRule({ [key]: value + step });
      ctl.append(r);
    }
    return ctl;
  }

  function skillTile(s, sk) {
    const value = sk.field ? (s[sk.field] ?? 0) : 0;
    const off = sk.soon || (sk.key !== "points" && value === 0);
    const tile = node("div", undefined, "skill" + (off ? " off" : "") + (sk.soon ? " soon" : ""));
    const info = node("button", openTip === sk.key ? "✕" : "!", "infobtn");
    info.title = "¿Qué suma esto al juego?";
    info.setAttribute("aria-label", "¿Qué suma esto al juego?");
    info.onclick = () => { openTip = openTip === sk.key ? null : sk.key; renderMain(state); };
    tile.append(info, skillIconNode(sk), node("div", sk.label, "skilllabel"));
    if (sk.soon) {
      tile.append(node("div", "Próximamente", "soontag"));
    } else {
      tile.append(triStepper(s, sk.range, value, sk.unit, sk.step || 1));
      if (sk.key === "points" && s.me.is_host) {  // atajos para las duraciones más comunes
        const chips = node("div", undefined, "chips mini");
        for (const n of [3, 5, 7, 10]) {
          const c = node("button", String(n), "chip" + (s.points_to_win === n ? " on" : ""));
          c.onclick = () => setRule({ points_to_win: n });
          chips.append(c);
        }
        tile.append(chips);
      }
      if (sk.key === "versus" && value > 0 && (s.players.length % 2 || s.players.length < 4)) {
        tile.append(node("div", `Hoy son ${s.players.length}: hace falta una cantidad par (4 o más)`, "skillnote"));
      }
      if (sk.key === "golden") {  // la dorada vale doble: solo tiene sentido si hay doradas
        const dbl = node("label", undefined, "dbl2" + (value === 0 ? " dim" : ""));
        const chk = node("input");
        chk.type = "checkbox";
        chk.checked = s.golden_double && value > 0;
        chk.disabled = !s.me.is_host || value === 0;
        chk.onchange = () => setRule({ golden_double: chk.checked });
        dbl.append(chk, node("span", " Vale 2 puntos"));
        tile.append(dbl);
      }
    }
    if (openTip === sk.key) {
      const tip = node("div", undefined, "tip");
      tip.append(node("b", sk.label), node("p", sk.tip));
      tile.append(tip);
    }
    return tile;
  }

  function renderModePanel(main, s) {
    const mode = s.vote_chance === 0 ? "classic" : s.vote_chance === 100 ? "always" : "random";
    const panel = node("div", undefined, "modepanel");
    const head = node("div", undefined, "modehead");
    head.append(node("div", "MODO DE JUEGO", "modetitle"));
    const seg = node("div", undefined, "segmented");
    for (const [id, label, value] of MODES) {
      const b = node("button", label, "seg" + (mode === id ? " on" : ""));
      b.disabled = !s.me.is_host;
      b.onclick = () => setRule({ vote_chance: id === "random" && mode === "random" ? s.vote_chance : value });
      seg.append(b);
    }
    head.append(seg);
    panel.append(head);
    panel.append(node("p", MODES.find((m) => m[0] === mode)[3], "modedesc"));
    if (mode === "random") {
      const row = node("div", undefined, "modeextra");
      row.append(node("span", "🎲 Probabilidad de ronda sin juez"), triStepper(s, "vote_chance", s.vote_chance, "%", 5));
      panel.append(row);
    }
    main.append(panel);
  }

  let inviteTimer = null;
  async function copyInvite(btn) {
    try {
      await navigator.clipboard.writeText(inviteLink);
      btn.textContent = "✅ ¡Copiado!";
      clearTimeout(inviteTimer);
      inviteTimer = setTimeout(() => { btn.textContent = "🔗 Invitar"; }, 2000);
    } catch (e) {
      prompt("Copiá el link:", inviteLink);  // si el navegador no deja usar el portapapeles
    }

  function renderLobby(main, s, keepFocus) {
    renderModePanel(main, s);

    const grid = node("div", undefined, "skills");
    for (const sk of SKILLS) grid.append(skillTile(s, sk));
    main.append(grid);

    // Mazos de la sala
    const decks = node("div", undefined, "deckpanel");
    decks.append(node("h3", "Mazos de la sala"));

    const ul = node("ul", undefined, "decklist");
    for (const d of s.decks) {
      const li = node("li", `${d.name} — ${d.blacks} negras · ${d.whites} blancas `);

        b.onclick = () => send({ action: "remove_deck", deck: d.id });
        li.append(b);
      }
      ul.append(li);
    }
    decks.append(ul);

    const whites = s.decks.reduce((n, d) => n + d.whites, 0);

    let problem = "";
    if (blacks === 0) problem = "Falta al menos una carta negra.";
    else if (whites < s.needed_whites) {
      problem = `Hacen falta al menos ${s.needed_whites} cartas blancas para ${s.players.length} jugadores (hay ${whites}).`;
    }
    if (problem) decks.append(node("p", problem, "error"));

    let input = null;
    if (s.me.is_host) {
      // Mazos propios o públicos que todavía no están en la sala
      const inRoom = new Set(s.decks.map((d) => d.id));
      const free = deckOptions.filter((o) => !inRoom.has(o.id));
      if (free.length) {
        const row = node("div", undefined, "formrow");
        const sel = node("select");
        for (const o of free) {
          const op = node("option", o.name);
          op.value = String(o.id);
          sel.append(op);
        }
        if (free.some((o) => String(o.id) === selectDraft)) sel.value = selectDraft;
        sel.onchange = () => { selectDraft = sel.value; };
        const add = node("button", "Agregar mazo");
        add.onclick = () => send({ action: "add_deck", deck: Number(sel.value) });
        row.append(sel, add);
        decks.append(row);
      }

      // Mazo compartido por otra persona (código)
      const row2 = node("div", undefined, "formrow");
      input = node("input");
      input.id = "deck-code";
      input.placeholder = "Código de mazo compartido";
      input.maxLength = 12;
      input.value = codeDraft;
      input.oninput = () => { codeDraft = input.value; };
      const addCode = () => {
        const code = input.value.trim();
        if (!code) return;
        send({ action: "add_deck", code });
        codeDraft = "";
        input.value = "";
      };
      input.onkeydown = (e) => { if (e.key === "Enter") addCode(); };
      const addByCode = node("button", "Agregar por código");
      addByCode.onclick = addCode;
      row2.append(input, addByCode);
      decks.append(row2);
      decks.append(node("p", "Los mazos se crean y se comparten desde «Mis mazos».", "muted"));
    }
    main.append(decks);

    // Invitar y empezar
    const actions = node("div", undefined, "lobbyactions");
    const inv = node("button", "🔗 Invitar", "lobbybtn");
    inv.onclick = () => copyInvite(inv);
    actions.append(inv);
    if (s.me.is_host) {
      const start = node("button", "▶ Empezar", "lobbybtn go");
      start.disabled = s.players.length < s.min_players || !!problem;
      start.onclick = () => send({ action: "start_game" });
      actions.append(start);
    }
    main.append(actions);
    main.append(node("p", s.me.is_host
      ? `Se necesitan al menos ${s.min_players} jugadores para empezar.`
      : "Esperá a que el host empiece la partida.", "muted lobbyhint"));

    if (keepFocus && input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }

  function renderFinished(main, s) {
    const medals = ["🥇", "🥈", "🥉"];
    const ranking = [...s.players].sort((a, b) => b.score - a.score);
    main.append(node("h3", "🏆 Partida terminada"));
    const ul = node("ul", undefined, "decklist");
    ranking.forEach((p, i) => ul.append(node("li", `${medals[i] || "▫️"} ${p.nickname} — ${p.score} pts`)));
    main.append(ul);

    pb.onclick = () => showPodium(s);
    main.append(pb, " ");
    const a = node("a", "Volver al inicio", "btn");
    a.href = "{% url 'game:home' %}";

  // ---- mesa: negra a la izquierda, jugadas al centro y la mano en abanico abajo ----
  let seenRound = -1, seenSubs = new Set();  // jugadas ya mostradas boca arriba (para animar solo las nuevas)

  // Cartas que entran a la mano (rolleo o robo): id -> cuándo y de qué tipo, para animarlas al dibujarse
  const dealQueue = new Map();

  // Compara la mano de antes con la nueva (misma ronda, antes de jugar) y anima lo que salió y lo que entró
  function animateHandChanges(prev, s) {
    if (!prev || prev.state !== "playing" || s.state !== "playing" || prev.round !== s.round) return;
    if (prev.me.has_played || s.me.has_played) return;
    const had = new Set(prev.me.hand.map((c) => c.id)), has = new Set(s.me.hand.map((c) => c.id));
    const gone = prev.me.hand.filter((c) => !has.has(c.id));
    const came = s.me.hand.filter((c) => !had.has(c.id));
    if (!gone.length && !came.length) return;
    const reroll = gone.length > 0 && came.length > 0;
    for (const c of gone) {
      const el = document.querySelector(`.fan .c.fc[data-cid="${c.id}"]`);
      if (el) spawnGhost(el, reroll ? "reroll" : "stolen");
    }
    for (const c of came) dealQueue.set(c.id, { kind: reroll ? "reroll" : "gain", at: performance.now() });
  }

  // Copia flotante de la carta que se va: sigue donde estaba mientras la vieja desaparece del abanico
  function spawnGhost(el, kind) {
    const r = el.getBoundingClientRect();
    if (!r.width) return;
    const cs = getComputedStyle(el);
    const g = el.cloneNode(true);
    g.className = "c white ghostout " + kind;
    g.removeAttribute("style");
    g.style.cssText = `left:${r.left + r.width / 2 - el.offsetWidth / 2}px;top:${r.top + r.height / 2 - el.offsetHeight / 2}px;`
      + `width:${el.offsetWidth}px;height:${el.offsetHeight}px;font-size:${cs.fontSize};padding:${cs.padding};`
      + `--ang:${el.style.getPropertyValue("--ang") || "0deg"};--sc:${el.classList.contains("selected") ? 1.2 : 1};`;
    document.body.append(g);
    g.addEventListener("animationend", () => g.remove());
    setTimeout(() => g.remove(), 1500);  // por si el navegador no dispara animationend
  }

  function pendingPill(s) {
    const pill = node("div", undefined, "pill pendpill");
    let long, short, title = "";
    if (s.state === "playing") {
      const pend = s.players.filter((x) => !x.is_judge && !x.has_played && (!s.versus_round || x.in_duel));
      title = pend.map((x) => x.nickname).join(", ");
      long = pend.length ? "⏳ Faltan: " + title : "✔ Todos jugaron";
      short = pend.length ? `⏳ Faltan ${pend.length}` : "✔ Todos jugaron";
    } else if (s.vote_round) {
      long = short = `🗳️ Votaron ${s.votes_cast} de ${s.voters_total}`;
    } else {
      const done = s.submissions.filter((x) => x.revealed !== false).length;
      long = short = s.me.is_judge ? `👀 Leídas ${done} de ${s.submissions.length}` : "⚖️ El juez está leyendo";
    }
    pill.append(node("span", long, "long"), node("span", short, "short"));
    if (title) pill.title = title;
    return pill;
  }

  // Mano en abanico: cada carta lleva su posición (--t) y su giro (--ang); el CSS hace el resto
  function fanNode(s, pick) {
    const showGold = !s.blind_round && (s.me.golden_left ?? 0) > 0;
    const els = [];
    if (showGold) els.push(goldenCardNode(pick));
    for (const c of s.me.hand) {
      const idx = selected.indexOf(c.id);
      const label = idx >= 0 && pick > 1 ? `${idx + 1}. ${c.text}` : c.text;
      const cardEl = cardNode(label, "white" + (idx >= 0 ? " selected" : ""), () => toggle(c.id, pick));
      const dq = dealQueue.get(c.id);
      if (dq) {
        const el = performance.now() - dq.at;
        if (el < 1000) {  // como la mano se redibuja, la animación retoma desde donde iba
          cardEl.classList.add("dealin", dq.kind);
          cardEl.style.animationDelay = `${(dq.kind === "reroll" ? 140 : 0) - el}ms`;
        } else dealQueue.delete(c.id);
      }
      els.push(cardEl);
    }
    const n = els.length;
    const fan = node("div", undefined, "fan" + (s.me.myopic ? " myopic" : ""));
    fan.style.setProperty("--nm1", String(Math.max(1, n - 1)));
    const spread = Math.min(4.5, 32 / Math.max(1, n - 1));  // grados entre cartas contiguas
    els.forEach((el, i) => {
      const t = i - (n - 1) / 2;
      el.classList.add("fc");
      if (el.dataset.cid === undefined && s.me.hand[i - (showGold ? 1 : 0)]) el.dataset.cid = String(s.me.hand[i - (showGold ? 1 : 0)].id);
      el.style.setProperty("--t", String(t));
      el.style.setProperty("--ang", (t * spread).toFixed(2) + "deg");
      el.style.setProperty("--dy", (t * t * 2.2).toFixed(1) + "px");
      el.style.zIndex = el.classList.contains("selected") ? "60" : String(i + 1);
      fan.append(el);
    });
    return fan;
  }

  // Con 1 sola carta por jugada, las flechas pasan la selección a la carta anterior/siguiente
  function stepSelection(dir) {
    const s = state;
    const ids = [];
    if (!s.blind_round && (s.me.golden_left ?? 0) > 0) ids.push("G");
    s.me.hand.forEach((c) => ids.push(c.id));
    if (!ids.length) return;
    const cur = ids.indexOf(selected[0]);
    const next = ids[(cur + dir + ids.length) % ids.length];
    selected = [next];
    focusGolden = next === "G";
    if (!refreshSelection()) renderMain(s);
  }

  // Selector de a quién robarle (la víctima se elige antes de ver su mano boca abajo)
  let pickerOpen = false;
  function openStealPicker() { pickerOpen = true; renderStealPicker(state); }
  function closePicker() { pickerOpen = false; myopicOpen = false; if (stealTarget === null) $("steal").hidden = true; }

  // Miopes: elegir a quién dejar con la vista nublada (se aplica al toque, sin esperar nada)
  let myopicOpen = false;
  function canMyopic(s) {
    return s.state === "playing" && !s.blind_round && (s.myopic_per_player ?? 0) > 0 && (s.me.myopic_left ?? 0) > 0
      && (!s.versus_round || s.me.in_duel_self);
  }
  function canMyopicOn(s, p) {
    return canMyopic(s) && p.id !== s.me.id && !p.is_judge && !p.has_played && !p.myopic && (!s.versus_round || p.in_duel);
  }
  function openMyopicPicker() { myopicOpen = true; renderMyopicPicker(state); }
  function renderMyopicPicker(s) {
    const box = $("steal");
    if (!canMyopic(s)) { closePicker(); return; }
    box.hidden = false;
    box.replaceChildren();
    const card = node("div", undefined, "stealbox myopicbox");
    card.append(node("h3", "👓 ¿A quién le nublás la vista?"));
    card.append(node("p", `Te quedan ${s.me.myopic_left} uso${s.me.myopic_left === 1 ? "" : "s"}. `
      + "Esa persona va a ver sus cartas borrosas y mezcladas hasta que juegue.", "hint"));
    const list = node("div", undefined, "targets");
    for (const p of s.players.filter((x) => canMyopicOn(s, x))) {
      const b = node("button", undefined, "target");
      b.append(avatarNode(p.nickname), node("span", p.nickname));
      b.onclick = () => { closePicker(); send({ action: "myopic", player: p.id }); };
      list.append(b);
    }
    if (!list.children.length) list.append(node("p", "Ahora no hay a quién: ya jugaron o ya están miopes.", "hint"));
    card.append(list);
    const cancel = node("button", "Cancelar", "ghostbtn");
    cancel.onclick = closePicker;
    card.append(cancel);
    box.append(card);
  }

  // Aviso para quien se queda miope (se muestra un instante)
  let myopicAlertTimer = null;
  function showMyopicAlert(by) {
    const box = $("myopic");
    box.replaceChildren();
    const inner = node("div", undefined, "robbedbox");
    inner.append(node("div", "👓", "robbedicon"), node("h2", "¡Te dejaron miope!"),
                 node("p", `${by} te nubló la vista: tus cartas se ven borrosas y mezcladas hasta que juegues.`));
    box.append(inner);
    box.hidden = false;
    clearTimeout(myopicAlertTimer);
    const hide = () => { box.hidden = true; clearTimeout(myopicAlertTimer); };
    box.onclick = hide;
    myopicAlertTimer = setTimeout(hide, 3000);
  }
  function renderStealPicker(s) {
    const box = $("steal");
    if (!canSteal(s)) { closePicker(); return; }
    box.hidden = false;
    box.replaceChildren();
    const card = node("div", undefined, "stealbox");
    card.append(node("h3", "🦹 ¿A quién le robás?"));
    card.append(node("p", `Te quedan ${s.me.steals_left} robo${s.me.steals_left === 1 ? "" : "s"}. `
      + "Primero elegís a la víctima y después una carta a ciegas.", "hint"));
    const list = node("div", undefined, "targets");
    for (const p of s.players.filter((x) => canStealFrom(s, x))) {
      const b = node("button", undefined, "target");
      b.append(avatarNode(p.nickname), node("span", p.nickname),
               node("small", `${s.hand_counts?.[p.id] ?? p.hand_count ?? 0} cartas`));
      b.onclick = () => { pickerOpen = false; startSteal(p); };
      list.append(b);
    }
    if (!list.children.length) list.append(node("p", "Ahora no hay a quién robarle: ya jugaron o ya los robaron.", "hint"));
    card.append(list);
    const cancel = node("button", "Cancelar", "ghostbtn");
    cancel.onclick = closePicker;
    card.append(cancel);
    box.append(card);
  }

  // Cartelera de duelos: quién enfrenta a quién, cuál toca ahora y quién ganó los anteriores
  function versusStrip(s) {
    const v = s.versus;
    const strip = node("div", undefined, "duelstrip");
    v.pairs.forEach(([a, b], i) => {
      const done = v.done[i];
      const now = s.state === "judging" && i === v.index;
      const chip = node("div", undefined, "duelchip" + (done ? " done" : "") + (now ? " now" : ""));
      const na = node("span", a, "dn" + (done && done.winner === a ? " win" : ""));
      const nb = node("span", b, "dn" + (done && done.winner === b ? " win" : ""));
      chip.append(na, node("b", "⚔️"), nb);
      if (done) chip.append(node("small", `${done.votes}–${done.loser_votes}${done.tie ? " 🎲" : ""}`));
      strip.append(chip);
    });
    return strip;
  }

  function renderBoard(main, s) {
    s.me.in_duel_self = !!s.players.find((x) => x.id === s.me.id)?.in_duel;
    const board = node("div", undefined, "board");
    const pick = s.black.pick;
    const playing = s.state === "playing";

    // Barra superior: quiénes faltan + accesos al ranking y al chat (en pantallas chicas son paneles laterales)
    const bar = node("div", undefined, "gamebar");
    bar.append(pendingPill(s), node("span", undefined, "spacer"));
    const rank = node("button", "🏆 Ranking", "pill sidebtn");
    rank.onclick = () => openSide("rank");
    const chat = node("button", "💬 Chat", "pill sidebtn");
    const badge = node("span", String(unread), "unreadbadge chatbadge");
    badge.hidden = !unread;
    chat.append(badge);
    chat.onclick = () => openSide("chat");
    bar.append(rank, chat);
    board.append(bar);

    if (s.vote_round) {  // ronda sin juez: el aviso se anima solo la primera vez en cada ronda
      const vtext = s.versus_round
        ? (playing
            ? (s.me.in_duel_self
                ? `⚔️ ¡Te toca! Duelo contra ${s.versus.duel.find((n) => n !== s.me.nickname)}: elegí tu carta.`
                : `⚔️ Duelo ${s.versus.index + 1} de ${s.versus.pairs.length}: ${s.versus.duel.join(" vs ")} están eligiendo carta. Después votan los demás.`)
            : s.me.in_duel_self
              ? "⚔️ ¡Te toca! Estás en este duelo: votan los demás."
              : "⚔️ Duelo en curso: votá la respuesta que más te guste.")
        : !s.blind_round
        ? "🗳️ Ronda de votación: todos juegan y todos votan. No podés votar tu propia carta."
        : playing
          ? "🕶️ Ronda de descarte: la carta negra es sorpresa. Jugá la carta que MENOS te importe perder; se revela cuando todos jugaron."
          : "🕶️ Ronda de descarte: así quedó la negra. Votá la mejor respuesta (no la tuya).";
      const vb = node("div", vtext, "votebanner" + (s.versus_round ? " versus" : "")
                                       + (voteBannerRound !== s.round + (s.versus_round ? s.versus.index / 100 : 0) ? " pop" : ""));
      voteBannerRound = s.round + (s.versus_round ? s.versus.index / 100 : 0);
      board.append(vb);
      if (s.versus_round) board.append(versusStrip(s));
    }

    if (playing && s.me.myopic && !s.me.has_played) {
      board.append(node("div", `👓 ${s.me.myopic_by} te nubló la vista: tus cartas están borrosas y mezcladas. Pasá el mouse o seleccionalas para verlas un poco mejor.`, "myopicbanner"));
    }
    const canAct = playing && !s.me.is_judge && !s.me.has_played && (!s.versus_round || s.me.in_duel_self);
    rollBtn = null;

    // Escenario: herramientas | carta negra | jugadas de la mesa
    const arena = node("div", undefined, "arena" + (playing ? "" : " judging"));
    const tools = node("div", undefined, "tools");
    if (canAct) {
      if (s.steals_per_player > 0 && !s.blind_round) {
        const st = node("button", `🦹 Choriar (${s.me.steals_left ?? 0})`, "btn-steal");
        st.disabled = !canSteal(s) || !s.players.some((p) => canStealFrom(s, p));
        st.onclick = openStealPicker;
        tools.append(st);
      }
      if (s.myopic_per_player > 0 && !s.blind_round) {
        const my = node("button", `👓 Miopear (${s.me.myopic_left ?? 0})`, "btn-steal btn-myopic");
        my.disabled = !canMyopic(s) || !s.players.some((p) => canMyopicOn(s, p));
        my.title = "Dejá miope a un rival: ve sus cartas borrosas y mezcladas";
        my.onclick = openMyopicPicker;
        tools.append(my);
      }
      if (s.rerolls_per_player > 0 && !s.blind_round) {
        const left = s.me.rerolls_left ?? 0;
        const rr = node("button", `🔄 Rollear (${left})`, "btn-roll");
        rr.disabled = rollDisabled(s);
        rollBtn = rr;
        rr.title = "Elegí una carta y tocá acá para cambiarla por otra";
        rr.onclick = async () => {
          const id = selected[0];
          const old = state.me.hand.find((c) => c.id === id);
          if (!old) return;
          const prev = node("div", undefined, "confirmcard");
          prev.append(cardNode(old.text, "white"));
          const after = (state.me.rerolls_left ?? 0) - 1;
          const yes = await askConfirm({ icon: "🔄", title: "¿Rollear esta carta?", content: prev, tone: "roll",
            text: `Se descarta y recibís una nueva al azar. ${after > 0 ? `Después te quedan ${after} cambio${after === 1 ? "" : "s"}.` : "Es tu último cambio."}`,
            ok: "Rollear", cancel: "Me la quedo" });
          if (yes && selected[0] === id) send({ action: "reroll", card: id });
        };
        tools.append(rr);
      }
    }
    arena.append(tools);
    const blackWrap = node("div", undefined, "blackwrap");
    blackWrap.append(blackCardNode(s));
    arena.append(blackWrap);

    const tableEl = node("div", undefined, "tablecards" + (playing ? " pile" : ""));
    if (playing) {
      // Boca abajo y apiladas: nadie ve qué jugó cada uno hasta el juicio
      const played = s.players.filter((x) => !x.is_judge && x.has_played);
      if (played.length) played.forEach(() => tableEl.append(cardNode("", "back")));
      else tableEl.append(node("div", undefined, "slot"));
    } else {
      const voting = !!s.vote_round;
      if (seenRound !== s.round) { seenRound = s.round; seenSubs = new Set(); }
      for (const sub of s.submissions) {
        const faceUp = sub.revealed !== false;
        if (!faceUp) {  // boca abajo: solo el juez puede darla vuelta (con un clic)
          const down = node("div", undefined, "sub facedown" + (s.me.is_judge ? " clickable" : ""));
          for (let i = 0; i < (sub.n || 1); i++) down.append(cardNode("", "back"));
          if (s.me.is_judge) {
            down.title = "Tocá para darla vuelta";
            down.onclick = () => {
              down.classList.add("turning");
              send({ action: "reveal", submission: sub.id });
            };
          }
          tableEl.append(down);
          continue;
        }
        const fresh = !seenSubs.has(sub.id);
        seenSubs.add(sub.id);
        const canPick = voting ? (!sub.mine && !s.me.in_duel_self) : s.me.is_judge;  // en votación, la propia jugada no se puede votar
        const group = node("div", undefined, "sub" + (selectedSub === sub.id ? " selected" : "")
                                                    + (canPick ? " clickable" : "") + (sub.mine ? " mine" : "")
                                                    + (voting && s.me.vote === sub.id ? " voted" : "")
                                                    + (fresh && !voting ? " flipin" : ""));
        sub.cards.forEach((t) => group.append(cardNode(t, "white")));
        if (sub.mine) group.append(node("div", "Tu jugada", "subtag"));
        else if (voting && s.me.in_duel_self) group.append(node("div", "Rival", "subtag"));
        else if (voting && s.me.vote === sub.id) group.append(node("div", "✅ Tu voto", "subtag"));
        if (canPick) {
          group.onclick = () => {
            selectedSub = voting ? sub.id : (selectedSub === sub.id ? null : sub.id);
            renderMain(state);
          };
        }
        tableEl.append(group);
      }
    }
    arena.append(tableEl);
    board.append(arena);

    // Acciones
    const actions = node("div", undefined, "actions");
    if (playing) {
      if (s.versus_round && !s.me.in_duel_self) {
        actions.append(node("p", `⏳ Ahora juegan ${s.versus.duel.join(" y ")}. Esperá: después votás vos.`, "hint"));
      } else if (s.me.is_judge) {
        actions.append(node("p", "⚖️ Sos el juez de esta ronda. Esperá a que los demás jueguen.", "hint"));
      } else if (s.me.has_played) {
        actions.append(node("p", "Ya jugaste. Esperando al resto…", "hint"));
      } else {
        const row = node("div", undefined, "playrow");
        const arrows = pick === 1 && s.me.hand.length > 1;
        if (arrows) {
          const prev = node("button", "◀", "arrow");
          prev.setAttribute("aria-label", "Carta anterior");
          prev.onclick = () => stepSelection(-1);
          row.append(prev);
        }
        const play = node("button", pick > 1 ? `Jugar ${pick} cartas` : "Jugar", "bigbtn");
        play.disabled = !canPlay();
        playBtn = play;
        play.onclick = () => {
          const gi = selected.indexOf("G");
          const msg = { action: "play_cards", cards: selected.filter((x) => x !== "G") };
          if (gi >= 0) msg.golden = { slot: gi, text: goldenText.trim() };
          send(msg);
          // La selección se limpia sola cuando llega el estado nuevo (si hay un error, no se pierde)
        };
        row.append(play);
        if (arrows) {
          const next = node("button", "▶", "arrow");
          next.setAttribute("aria-label", "Carta siguiente");
          next.onclick = () => stepSelection(1);
          row.append(next);
        }
        actions.append(row);
      }
    } else if (s.vote_round) {
      const mine = s.me.vote;
      if (s.me.in_duel_self) {
        actions.append(node("p", "⚔️ Estás en este duelo: esperá a que voten los demás.", "hint"));
      } else {
        const vote = node("button", mine ? "🗳️ Cambiar voto" : "🗳️ Votar", "bigbtn");
        vote.disabled = selectedSub === null || selectedSub === mine;
        vote.onclick = () => send({ action: "vote", submission: selectedSub });
        actions.append(vote);
        actions.append(node("p", mine
          ? "Ya votaste, podés cambiar tu voto hasta que voten todos"
          : "Tocá la respuesta que más te guste (no la tuya)", "hint"));
      }
    } else if (s.me.is_judge) {
      const win = node("button", "🏆 Elegir ganadora", "bigbtn");
      win.disabled = selectedSub === null;
      win.onclick = () => { send({ action: "pick_winner", submission: selectedSub }); selectedSub = null; };
      actions.append(win);
      const anyUp = s.submissions.some((x) => x.revealed !== false);
      const allUp = s.submissions.every((x) => x.revealed !== false);
      if (!anyUp) actions.append(node("p", "Tocá una carta para darla vuelta y leerla.", "hint"));
      else if (selectedSub === null) {
        actions.append(node("p", allUp ? "Tocá la respuesta que más te gustó."
          : "Seguí dando vuelta las cartas y tocá la que más te guste para elegirla.", "hint"));
      }
    } else {
      actions.append(node("p", "El juez está dando vuelta las cartas y leyéndolas…", "hint"));
    }
    board.append(actions);

    // Mano en abanico (solo mientras se juega, y no para el juez)
    if (playing && !s.me.is_judge && (!s.versus_round || s.me.in_duel_self)) {
      const wrap = node("div", undefined, "fanwrap" + (s.me.has_played ? " locked" : ""));
      if (s.me.has_played) {
        wrap.append(node("div", undefined, "fan fan-empty"));
      } else {
        wrap.append(fanNode(s, pick));
      }
      board.append(wrap);
    }

    main.append(board);
  }

  function renderMain(s) {
    const main = $("main");
    const ae = document.activeElement;
    const keepFocus = !!ae && ae.id === "deck-code";
    const keepGolden = !!ae && ae.id === "golden-input";
    const caret = keepGolden ? [ae.selectionStart, ae.selectionEnd] : [0, 0];
    main.replaceChildren();
    main.className = s.state === "finished" ? "panel" : s.state === "lobby" ? "lobby" : "";

    if (s.state === "lobby") { renderLobby(main, s, keepFocus); return; }
    if (s.state === "finished") { renderFinished(main, s); return; }
    renderBoard(main, s);

    const g = $("golden-input");
    if (g && (focusGolden || keepGolden)) {
      g.focus();
      const [a, b] = focusGolden ? [g.value.length, g.value.length] : caret;
      g.setSelectionRange(a, b);
      focusGolden = false;
    }
  }

  function render(s) {
    const first = state === null;  // primer estado recibido (entrada o recarga)
    for (const p of s.players) { if (p.avatar) avatarMap.set(p.nickname, p.avatar); else avatarMap.delete(p.nickname); }
    if (first) {  // el personaje elegido en la pantalla de apodo se le avisa al servidor al entrar
      const mine = window.cartasAvatarGet && window.cartasAvatarGet();
      if (mine && s.me.avatar !== mine) { avatarMap.set(s.me.nickname, mine); send({ action: "avatar", emoji: mine }); }
    }
    const justFinished = !first && s.state === "finished" && state.state !== "finished";
    const ingame = s.state === "playing" || s.state === "judging";
    document.querySelector(".layout").classList.toggle("game", ingame);
    document.body.classList.toggle("ingame", ingame);
    if (!ingame) closeSide();
    animateHandChanges(state, s);
    if (first && s.submissions) { seenRound = s.round; seenSubs = new Set(s.submissions.filter((x) => x.revealed !== false).map((x) => x.id)); }
    trackScores(s);
    if (state && state.black && state.black.secret && s.black && !s.black.secret && s.round === state.round) {
      decryptRound = s.round; decryptStart = performance.now();
    }
    s.me.in_duel_self = !!s.players.find((x) => x.id === s.me.id)?.in_duel;
    // Versus: terminó un duelo (no el último, ese llega con el resultado de la ronda): se muestra su resultado
    if (state && !first && s.versus_round && state.versus_round && s.round === state.round
        && s.versus && state.versus && s.versus.done.length > state.versus.done.length && s.black && s.black.text) {
      showDuelReveal(s.versus.done[s.versus.done.length - 1], s.black.text, false);
    }
    if (state && !first && !state.me.myopic && s.me.myopic && s.round === state.round) showMyopicAlert(s.me.myopic_by);
    if (!s.me.myopic || s.state !== "playing") $("myopic").hidden = true;
    state = s;
    const ids = new Set(s.me.hand.map((c) => c.id));
    const goldenOk = s.state === "playing" && !s.me.is_judge && !s.me.has_played
                     && (s.me.golden_left ?? 0) > 0;
    selected = selected.filter((id) => ids.has(id) || (id === "G" && goldenOk));
    if ((s.me.golden_left ?? 0) <= 0) goldenText = "";  // ya la usó: se descarta el borrador
    if (s.state !== "judging" || !s.submissions.some((x) => x.id === selectedSub)) selectedSub = null;
    if (s.state === "judging" && s.vote_round && selectedSub === null && s.me.vote) selectedSub = s.me.vote;

    $("round-pill").textContent =
      s.state === "lobby" ? "Lobby" : s.state === "finished" ? "Partida terminada"
        : `Ronda ${s.round}` + (s.versus_round ? " · ⚔️ Versus" : s.vote_round ? " · 🗳️ Votación" : "");
    $("goal-pill").hidden = s.state === "lobby";
    $("goal-pill").textContent = `A ${s.points_to_win} puntos`
      + (s.golden_double && s.golden_per_player > 0 ? " · ⭐ vale 2" : "");

    renderResult(s, first);
    if (justFinished) {
      if ($("reveal").hidden) showPodium(s);  // terminó sin una última revelación (p. ej. se fueron jugadores)
      else podiumPending = true;              // se muestra cuando se cierre la revelación de la última ronda
    }
    if (pendingCelebrate.size && $("reveal").hidden) flushCelebrate();
    renderPlayers(s);
    renderControls(s);
    renderMain(s);
    renderSteal(s);
    renderRobbed(s);
  }

  function connect() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${scheme}://${location.host}/ws/sala/{{ game.code }}/`);

    ws.onopen = () => {
      $("status").textContent = "Conectado ✅";
      clearInterval(pingTimer);
      pingTimer = setInterval(() => send({ action: "ping" }), 20000);
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "state") render(msg);
      else if (msg.type === "chat") addChat(msg.nick, msg.text);
      else if (msg.type === "error") { showToast(msg.message); if (stealTarget !== null) closeSteal(false); }
      else if (msg.type === "notice") showToast(msg.text);
    };
    ws.onclose = (e) => {
      clearInterval(pingTimer);
      if (e.code === 4403 || e.code === 4404) {  // sin reconexión: ya no pertenece a la sala
        $("status").textContent = e.code === 4404 ? "Ya no estás en esta sala" : "No pertenecés a esta sala";
        $("main").replaceChildren();
        $("players").replaceChildren();
        $("controls").replaceChildren();
        const a = node("a", "Volver al inicio", "btn");
        a.href = "{% url 'game:home' %}";
        $("main").append(a);
        return;
      }
      $("status").textContent = "Desconectado. Reintentando…";
      setTimeout(connect, 2000);
    };
  }
  connect();
</script>
{% endblock %}
