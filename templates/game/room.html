{% extends "base.html" %}
{% block wrapclass %}wide{% endblock %}
{% block content %}

<div class="roombar">
  <div class="pill">Sala <strong class="code-sm">{{ game.code }}</strong></div>
  <div class="pill accent" id="round-pill">Lobby</div>
  <div class="pill" id="goal-pill" hidden></div>
  <div class="pill" id="status">Conectando…</div>
  <button id="copy" class="ghostbtn">Copiar link de invitación</button>
</div>

<div id="toast" class="toast" hidden></div>
<div id="reveal" class="reveal" role="dialog" aria-live="polite" hidden></div>
<div id="podium" class="reveal podium" role="dialog" aria-live="polite" hidden></div>

<div class="layout">
  <section class="stage">
    <div id="result" hidden></div>
    <div id="main"></div>
  </section>

  <aside class="side">
    <div class="panel">
      <h3>Jugadores (<span id="pcount">0</span>)</h3>
      <ul id="players" class="plist"></ul>
      <div id="controls" class="ctrls"></div>
    </div>
    <div class="panel chat">
      <h3>Chat</h3>
      <div id="chatlog"></div>
      <form id="chatform" autocomplete="off">
        <input id="chatinput" maxlength="200" placeholder="Escribí un mensaje…">
        <button>➤</button>
      </form>
    </div>
  </aside>
</div>

{{ deck_options|json_script:"deck-options" }}

<script>
  const $ = (id) => document.getElementById(id);
  const inviteLink = location.origin + "{% url 'game:join' game.code %}";
  const deckOptions = JSON.parse($("deck-options").textContent);

  let ws = null, state = null, selected = [], selectedSub = null, toastTimer = null, pingTimer = null;
  let codeDraft = "", selectDraft = "";  // para no perder lo escrito cuando llega un refresco

  $("copy").onclick = async () => {
    try {
      await navigator.clipboard.writeText(inviteLink);
      $("copy").textContent = "¡Copiado!";
      setTimeout(() => { $("copy").textContent = "Copiar link de invitación"; }, 2000);
    } catch {
      prompt("Copiá el link:", inviteLink);
    }
  };

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // Siempre textContent: nunca innerHTML con texto de usuarios (evita XSS)
  function node(tag, text, cls) {
    const n = document.createElement(tag);
    if (text !== undefined) n.textContent = text;
    if (cls) n.className = cls;
    return n;
  }

  // Texto de una carta negra con cada "_" dibujado como un hueco subrayado
  function fillBlanks(card, text) {
    const t = node("span", undefined, "t");
    text.split(/_+/).forEach((part, i) => {
      if (i > 0) t.append(node("span", undefined, "blank"));
      t.append(document.createTextNode(part));
    });
    card.replaceChildren(t);
  }

  function cardNode(text, cls, onClick) {
    const n = node("div", text, "c " + cls);
    const kinds = cls.split(" ");
    if (kinds.includes("black") && typeof text === "string") fillBlanks(n, text);
    n.dataset.brand = kinds.includes("black") ? "Cartas Arg" : kinds.includes("gold") ? "ARG · dorada" : "ARG";
    if (onClick) { n.classList.add("clickable"); n.onclick = onClick; }
    return n;
  }

  // ---- carta dorada: una por jugador y por partida, escrita por el propio jugador ----
  const GOLDEN_MAX = 140;
  let goldenText = "";       // borrador (sobrevive a los refrescos del estado)
  let focusGolden = false;   // enfocar el cuadro de texto justo después de elegirla
  let playBtn = null;

  // En la selección, la carta dorada se representa con "G" (las de la mano, con su id)
  function canPlay() {
    if (!state || !state.black) return false;
    if (selected.length !== state.black.pick) return false;
    return !selected.includes("G") || goldenText.trim().length >= 3;
  }

  function updateSend() {
    if (playBtn) playBtn.disabled = !canPlay();
  }

  function goldenCardNode(pick) {
    const idx = selected.indexOf("G");
    const on = idx >= 0;
    const n = node("div", undefined, "c gold clickable" + (on ? " selected" : ""));
    n.dataset.brand = "ARG · dorada";
    n.onclick = () => toggle("G", pick);
    const prefix = on && pick > 1 ? (idx + 1) + ". " : "";
    n.append(node("div", prefix + "⭐ Carta dorada", "gtitle"));
    if (on) {
      const ta = node("textarea");
      ta.id = "golden-input";
      ta.maxLength = GOLDEN_MAX;
      ta.placeholder = "Escribí tu carta…";
      ta.value = goldenText;
      ta.onclick = (e) => e.stopPropagation();  // escribir no deselecciona la carta
      ta.oninput = () => { goldenText = ta.value; updateSend(); };
      n.append(ta);
    } else {
      n.append(node("div", goldenText.trim() || "Escribí tu propia carta (1 por partida)", "ghint"));
    }
    return n;
  }

  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
  }

  // ---- avatares: emoji + color determinísticos a partir del apodo ----
  const AVATARS = ["🦆", "🐱", "🐶", "👽", "🦊", "🐸", "🐼", "🦉", "🐙", "🦄", "🐵", "🐢", "🦖", "🐧", "🐯", "🦁"];
  function hash(str) {
    let h = 5381;
    for (const ch of str) h = ((h << 5) + h + ch.codePointAt(0)) | 0;
    return Math.abs(h);
  }
  function avatarNode(nick) {
    const n = node("div", AVATARS[hash(nick) % AVATARS.length], "avatar");
    n.style.background = `hsl(${hash(nick) % 360} 55% 38%)`;
    return n;
  }

  // ---- chat ----
  function addChat(nick, text) {
    const log = $("chatlog");
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    const row = node("div", undefined, "chatmsg");
    const who = node("b", nick + ":");
    who.style.color = `hsl(${hash(nick) % 360} 70% 72%)`;
    row.append(who, " ", document.createTextNode(text));
    log.append(row);
    while (log.children.length > 60) log.firstChild.remove();
    if (nearBottom) log.scrollTop = log.scrollHeight;
  }

  $("chatform").onsubmit = (e) => {
    e.preventDefault();
    const input = $("chatinput");
    const text = input.value.trim();
    if (!text) return;
    send({ action: "chat", text });
    input.value = "";
  };

  // ---- selección ----
  function toggle(id, pick) {
    const i = selected.indexOf(id);
    if (i >= 0) selected.splice(i, 1);
    else { selected.push(id); if (selected.length > pick) selected.shift(); }
    focusGolden = id === "G" && selected.includes("G");
    renderMain(state);
  }

  // ---- render ----
  // ---- animación del +1 cuando alguien suma un punto ----
  const CELEBRATE_MS = 1800;
  let prevScores = null;     // id -> puntos de la última vez (null hasta recibir el primer estado)
  const celebrating = {};    // id -> momento en que empezó la animación
  let shownRound = null;

  function trackScores(s) {
    if (prevScores) {
      for (const p of s.players) {
        if (prevScores[p.id] !== undefined && p.score > prevScores[p.id]) {
          pendingCelebrate.add(p.id);  // se anima al cerrarse la revelación (ver closeReveal)
        }
      }
    }
    prevScores = Object.fromEntries(s.players.map((p) => [p.id, p.score]));
  }

  // ---- revelación de la carta ganadora ----
  const REVEAL_SECONDS = 5;
  const pendingCelebrate = new Set();  // quiénes suman +1: se anima en el tablero al cerrarse la revelación
  let revealTimer = null;

  function flushCelebrate() {
    for (const id of pendingCelebrate) celebrating[id] = performance.now();
    pendingCelebrate.clear();
  }

  function closeReveal() {
    clearInterval(revealTimer);
    revealTimer = null;
    const box = $("reveal");
    if (box.hidden) return;
    box.hidden = true;
    box.replaceChildren();
    flushCelebrate();
    if (state) renderPlayers(state);  // ahora sí se ve el +1 en el tablero
    if (podiumPending && state) {     // la partida terminó: después de la revelación viene el podio
      podiumPending = false;
      showPodium(state);
    }
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closePodium(); closeReveal(); }
  });

  function showReveal(l, finished) {
    closeReveal();
    const box = $("reveal");
    box.hidden = false;
    box.replaceChildren();
    box.onclick = closeReveal;  // tocar la pantalla la saltea

    // Fondo: cartas fantasma y destellos
    [[4, 12, -18], [20, 70, 12], [44, 6, 8], [62, 78, -10], [80, 10, 20], [90, 62, -14]].forEach(([x, y, r]) => {
      const g = node("div", undefined, "ghostcard");
      g.style.left = x + "%";
      g.style.top = y + "%";
      g.style.transform = `rotate(${r}deg)`;
      box.append(g);
    });
    ["12% 22%", "50% 10%", "88% 24%", "8% 64%", "92% 68%", "48% 88%"].forEach((pos, i) => {
      const [x, y] = pos.split(" ");
      const sp = node("span", "✦", "sparkle");
      sp.style.left = x;
      sp.style.top = y;
      sp.style.animationDelay = (i * 0.35) + "s";
      box.append(sp);
    });

    const stage = node("div", undefined, "reveal-stage");
    stage.append(cardNode(l.black, "black"));

    // Centro: corona, quién ganó y cuenta regresiva
    const isMe = !!state && state.me.nickname === l.winner;
    const center = node("div", undefined, "reveal-center");
    const badge = node("div", undefined, "badge");
    badge.append(avatarNode(l.winner));
    const txt = node("div");
    txt.append(node("div", "La carta fue elegida por:", "badge-label"));
    txt.append(node("div", isMe ? l.winner + " (vos) 🎉" : l.winner, "badge-name"));
    badge.append(txt);
    const count = node("div", undefined, "countpill");
    center.append(node("div", "👑", "crown"), badge, count);
    stage.append(center);

    // Respuesta ganadora (acá sí se revela si era dorada: el juez ya eligió)
    const whites = node("div", undefined, "reveal-whites");
    l.cards.forEach((t, i) =>
      whites.append(cardNode(t, "white" + (l.golden && l.golden[i] ? " gold" : ""))));
    stage.append(whites);
    box.append(stage);

    let left = REVEAL_SECONDS;
    const label = finished ? "Resultados en" : "Siguiente ronda en";
    const paint = () => { count.textContent = `${label} ${left}…`; };
    paint();
    revealTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) closeReveal();
      else paint();
    }, 1000);
  }

  // ---- podio final ----
  let podiumPending = false;  // la partida terminó mientras se mostraba la revelación de la última ronda

  function closePodium() {
    const box = $("podium");
    if (box.hidden) return;
    box.hidden = true;
    box.replaceChildren();
  }

  // Puestos con empates: 1, 1, 3 (dos jugadores con el mismo puntaje comparten el puesto)
  function rankPlayers(players) {
    const sorted = [...players].sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    return sorted.map((p) => ({ p, rank: 1 + sorted.filter((q) => q.score > p.score).length }));
  }

  function showPodium(s) {
    closePodium();
    const box = $("podium");
    box.hidden = false;
    box.replaceChildren();
    box.onclick = closePodium;

    // Confeti y destellos (solo decoración)
    const colors = ["#6fd39a", "#f5c542", "#ff6b6b", "#7cc4ff", "#ffffff", "#c792ea"];
    for (let i = 0; i < 60; i++) {
      const c = node("span", undefined, "confetti");
      c.style.left = (Math.random() * 100).toFixed(1) + "%";
      c.style.background = colors[i % colors.length];
      c.style.setProperty("--t", (3 + Math.random() * 3).toFixed(2) + "s");
      c.style.setProperty("--d", (Math.random() * 3).toFixed(2) + "s");
      box.append(c);
    }
    ["10% 20%", "50% 8%", "90% 22%", "6% 62%", "94% 66%"].forEach((pos, i) => {
      const [x, y] = pos.split(" ");
      const sp = node("span", "✦", "sparkle");
      sp.style.left = x;
      sp.style.top = y;
      sp.style.animationDelay = (i * 0.4) + "s";
      box.append(sp);
    });

    const ranked = rankPlayers(s.players);
    const winners = ranked.filter((e) => e.rank === 1).map((e) => e.p.nickname);
    const iWon = winners.includes(s.me.nickname);

    const stage = node("div", undefined, "podium-stage");
    const title = node("div", undefined, "podium-title");
    title.append(node("div", "🏆 ¡Fin de la partida!"));
    title.append(node("div",
      iWon ? "¡Ganaste! 🎉" : winners.length > 1 ? "Empate: " + winners.join(" y ") : "¡Ganó " + winners[0] + "!",
      "podium-sub"));
    stage.append(title);

    // Podio: 2.º a la izquierda, 1.º en el centro, 3.º a la derecha
    const top = ranked.slice(0, 3);
    const order = [top[1], top[0], top[2]].filter(Boolean);
    const delays = { 1: [1.5, 2.2], 2: [0.9, 1.6], 3: [0.3, 1.0] };  // [sube el bloque, aparece la persona]
    const podium = node("div", undefined, "podiumrow");
    order.forEach(({ p, rank }) => {
      const [bd, wd] = delays[rank];
      const col = node("div", undefined, "pcol rank" + rank);
      const who = node("div", undefined, "pwho");
      who.style.setProperty("--wd", wd + "s");
      if (rank === 1) {
        const crown = node("div", "👑", "pcrown");
        crown.style.setProperty("--cd", (wd + 0.5).toFixed(1) + "s");
        who.append(crown);
      }
      who.append(avatarNode(p.nickname), node("div", p.nickname, "podname"), node("div", p.score + " pts", "podpts"));
      const block = node("div", String(rank), "pblock");
      block.style.setProperty("--bd", bd + "s");
      col.append(who, block);
      podium.append(col);
    });
    stage.append(podium);

    const btn = node("button", "Ver resultados", "bigbtn podium-btn");
    btn.onclick = closePodium;
    stage.append(btn);
    box.append(stage);
  }

  function renderResult(s, first) {
    const r = $("result");
    if (!s.last_result || s.state === "lobby") { r.hidden = true; return; }
    const l = s.last_result;
    r.hidden = false;
    r.textContent = `🏆 Ronda ${l.round}: ganó ${l.winner}. «${l.black}» → ${l.cards.map((t, i) => (l.golden && l.golden[i] ? "⭐ " : "") + t).join(" / ")}`;
    if (l.round !== shownRound) {
      shownRound = l.round;
      if (!first) {  // al entrar o recargar no se anima
        r.classList.remove("pop");
        void r.offsetWidth;  // reinicia la animación
        r.classList.add("pop");
        showReveal(l, s.state === "finished");
      }
    }
  }

  function renderPlayers(s) {
    $("pcount").textContent = s.players.length;
    const ul = $("players");

    // Posición de cada fila antes de redibujar (respecto del borde de la lista), para animar el cambio de orden
    const before = {};
    const o0 = ul.getBoundingClientRect().top;
    for (const row of ul.children) before[row.dataset.pid] = row.getBoundingClientRect().top - o0;

    // En partida se ordena por puntaje (a igual puntaje, por orden de entrada).
    // Mientras se muestra la revelación de la ronda, el ganador cuenta con su puntaje anterior:
    // así el cambio de lugar y el "match point" se ven recién cuando se cierra (ver closeReveal).
    const inGame = s.state !== "lobby";
    const eff = (p) => (pendingCelebrate.has(p.id) ? p.score - 1 : p.score);
    const list = inGame ? [...s.players].sort((a, b) => eff(b) - eff(a)) : s.players;
    const goal = s.points_to_win;

    ul.replaceChildren();
    for (const p of list) {
      // Match point: le falta un punto para ganar (solo mientras la partida sigue en juego)
      const matchPoint = inGame && s.state !== "finished" && goal > 1 && eff(p) === goal - 1;
      const li = node("li", undefined, "prow" + (p.online ? "" : " offline") + (matchPoint ? " matchpoint" : ""));
      li.dataset.pid = p.id;
      li.append(avatarNode(p.nickname));

      const name = node("div", undefined, "pname");
      name.append(node("span", p.nickname + (p.id === s.me.id ? " (vos)" : "")));
      if (p.is_host) name.append(node("span", " 👑"));
      if (p.is_judge && s.state !== "lobby") name.append(node("span", " ⚖️"));
      if (s.state === "playing" && !p.is_judge) name.append(node("span", p.has_played ? " ✅" : " ⏳"));
      if (!p.online) name.append(node("span", " 🔌"));
      if (matchPoint) name.append(node("div", "⚡ MATCH POINT", "mp-tag"));
      li.append(name);

      if (s.me.is_host && p.id !== s.me.id && s.state !== "finished") {
        const k = node("button", "✕", "kick");
        k.title = `Expulsar a ${p.nickname}`;
        k.onclick = () => {
          if (confirm(`¿Expulsar a ${p.nickname}?`)) send({ action: "kick", player: p.id });
        };
        li.append(k);
      }
      const scoreEl = node("div", String(p.score), "score");
      const started = celebrating[p.id];
      if (started !== undefined) {
        const elapsed = performance.now() - started;
        if (elapsed < CELEBRATE_MS) {
          // Como la lista se redibuja en cada refresco, la animación se reanuda
          // desde donde iba (delay negativo) en vez de arrancar de cero.
          li.classList.add("scored");
          li.style.setProperty("--d", `-${Math.round(elapsed)}ms`);
          scoreEl.append(node("span", "+1", "plus"));
        } else {
          delete celebrating[p.id];
        }
      }
      li.append(scoreEl);
      ul.append(li);
    }

    // Reordenamiento animado: cada fila arranca donde estaba y se desliza a su lugar nuevo.
    // Si justo se mostró un +1, se espera un instante para que se note antes de moverse.
    const o1 = ul.getBoundingClientRect().top;
    const wait = Math.max(0, ...Object.values(celebrating).map((t) => 700 - (performance.now() - t)));
    for (const row of ul.children) {
      const was = before[row.dataset.pid];
      if (was === undefined) continue;  // jugador nuevo: no hay de dónde venir
      const dy = was - (row.getBoundingClientRect().top - o1);
      if (Math.abs(dy) < 1) continue;
      row.style.transition = "none";
      row.style.transform = `translateY(${dy}px)`;
      void row.offsetHeight;  // fija la posición de partida antes de animar
      row.style.transition = `transform .6s cubic-bezier(.2, .8, .2, 1) ${Math.round(wait)}ms`;
      row.style.transform = "";
    }
  }

  function renderControls(s) {
    const box = $("controls");
    box.replaceChildren();

    const host = s.players.find((p) => p.is_host);
    if (!s.me.is_host && host && !host.online) {
      const b = node("button", "El host se desconectó: tomar el rol");
      b.onclick = () => send({ action: "claim_host" });
      box.append(b);
    }
    if (s.me.is_host && (s.state === "playing" || s.state === "judging")) {
      const b = node("button", "Saltear al juez");
      b.onclick = () => {
        if (confirm("Se cancela la ronda y pasa a otro juez. ¿Seguro?")) send({ action: "skip_judge" });
      };
      box.append(b);
    }
    if (s.me.is_host && s.state === "playing" && s.players.some((p) => p.has_played)) {
      const b = node("button", "Seguir sin los que faltan");
      b.onclick = () => send({ action: "force_judging" });
      box.append(b);
    }
    const leave = node("button", "Salir de la sala");
    leave.onclick = () => { if (confirm("¿Salir de la sala?")) send({ action: "leave" }); };
    box.append(leave);
  }

  function renderLobby(main, s, keepFocus) {
    main.append(node("h3", "Esperando jugadores"));
    main.append(node("p", `Se necesitan al menos ${s.min_players} para empezar.`, "muted"));
    main.append(node("p", "⭐ Cada jugador tiene 1 carta dorada por partida: la escribe él mismo y la juega como respuesta.", "muted"));

    main.append(node("h3", "Mazos de la sala"));
    if (!s.decks.length) main.append(node("p", "Todavía no hay mazos.", "muted"));
    const ul = node("ul", undefined, "decklist");
    for (const d of s.decks) {
      const li = node("li", `${d.name} — ${d.blacks} negras · ${d.whites} blancas `);
      if (s.me.is_host) {
        const b = node("button", "Quitar", "danger");
        b.onclick = () => send({ action: "remove_deck", deck: d.id });
        li.append(b);
      }
      ul.append(li);
    }
    main.append(ul);

    const whites = s.decks.reduce((n, d) => n + d.whites, 0);
    const blacks = s.decks.reduce((n, d) => n + d.blacks, 0);
    let problem = "";
    if (blacks === 0) problem = "Falta al menos una carta negra.";
    else if (whites < s.needed_whites) {
      problem = `Hacen falta al menos ${s.needed_whites} cartas blancas para ${s.players.length} jugadores (hay ${whites}).`;
    }
    if (problem) main.append(node("p", problem, "error"));

    if (!s.me.is_host) {
      main.append(node("p", "Esperá a que el host empiece la partida."));
      return;
    }

    // Mazos propios o públicos que todavía no están en la sala
    const inRoom = new Set(s.decks.map((d) => d.id));
    const free = deckOptions.filter((o) => !inRoom.has(o.id));
    if (free.length) {
      const row = node("div", undefined, "formrow");
      const sel = node("select");
      for (const o of free) {
        const op = node("option", o.name);
        op.value = String(o.id);
        sel.append(op);
      }
      if (free.some((o) => String(o.id) === selectDraft)) sel.value = selectDraft;
      sel.onchange = () => { selectDraft = sel.value; };
      const add = node("button", "Agregar mazo");
      add.onclick = () => send({ action: "add_deck", deck: Number(sel.value) });
      row.append(sel, add);
      main.append(row);
    }

    // Mazo compartido por otra persona (código)
    const row2 = node("div", undefined, "formrow");
    const input = node("input");
    input.id = "deck-code";
    input.placeholder = "Código de mazo compartido";
    input.maxLength = 12;
    input.value = codeDraft;
    input.oninput = () => { codeDraft = input.value; };
    const addCode = () => {
      const code = input.value.trim();
      if (!code) return;
      send({ action: "add_deck", code });
      codeDraft = "";
      input.value = "";
    };
    input.onkeydown = (e) => { if (e.key === "Enter") addCode(); };
    const addByCode = node("button", "Agregar por código");
    addByCode.onclick = addCode;
    row2.append(input, addByCode);
    main.append(row2);
    if (keepFocus) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
    main.append(node("p", "Los mazos se crean y se comparten desde «Mis mazos».", "muted"));

    const start = node("button", "Empezar partida", "bigbtn");
    start.disabled = s.players.length < s.min_players || !!problem;
    start.onclick = () => send({ action: "start_game" });
    main.append(start);
  }

  function renderFinished(main, s) {
    const medals = ["🥇", "🥈", "🥉"];
    const ranking = [...s.players].sort((a, b) => b.score - a.score);
    main.append(node("h3", "🏆 Partida terminada"));
    const ul = node("ul", undefined, "decklist");
    ranking.forEach((p, i) => ul.append(node("li", `${medals[i] || "▫️"} ${p.nickname} — ${p.score} pts`)));
    main.append(ul);
    const pb = node("button", "🏆 Ver podio");
    pb.onclick = () => showPodium(s);
    main.append(pb, " ");
    const a = node("a", "Volver al inicio", "btn");
    a.href = "{% url 'game:home' %}";
    main.append(a);
  }

  function renderBoard(main, s) {
    const board = node("div", undefined, "board");
    const pick = s.black.pick;

    // Fila superior: carta negra + mesa
    const top = node("div", undefined, "toprow");
    top.append(cardNode(s.black.text, "black"));
    const tableEl = node("div", undefined, "tablecards");

    if (s.state === "playing") {
      // Boca abajo: nadie ve qué jugó cada uno hasta el juicio
      for (const p of s.players.filter((x) => !x.is_judge)) {
        tableEl.append(p.has_played ? cardNode("", "back") : node("div", undefined, "slot"));
      }
    } else {
      for (const sub of s.submissions) {
        const group = node("div", undefined, "sub" + (selectedSub === sub.id ? " selected" : "")
                                                    + (s.me.is_judge ? " clickable" : ""));
        sub.cards.forEach((t) => group.append(cardNode(t, "white")));
        if (s.me.is_judge) {
          group.onclick = () => { selectedSub = selectedSub === sub.id ? null : sub.id; renderMain(state); };
        }
        tableEl.append(group);
      }
    }
    top.append(tableEl);
    board.append(top);

    // Acciones
    const actions = node("div", undefined, "actions");
    if (s.state === "playing") {
      if (s.me.is_judge) {
        actions.append(node("p", "⚖️ Sos el juez de esta ronda. Esperá a que los demás jueguen.", "hint"));
      } else if (s.me.has_played) {
        actions.append(node("p", "Ya jugaste. Esperando al resto…", "hint"));
      } else {
        const left = s.me.rerolls_left ?? 0;
        const play = node("button", pick > 1 ? `✈ Enviar ${pick} cartas` : "✈ Enviar carta", "bigbtn");
        play.disabled = !canPlay();
        playBtn = play;
        play.onclick = () => {
          const gi = selected.indexOf("G");
          const msg = { action: "play_cards", cards: selected.filter((x) => x !== "G") };
          if (gi >= 0) msg.golden = { slot: gi, text: goldenText.trim() };
          send(msg);
          // La selección se limpia sola cuando llega el estado nuevo (si hay un error, no se pierde)
        };

        const rr = node("button", `🔄 Cambiar carta (${left})`, "ghostbtn");
        rr.disabled = left <= 0 || selected.length !== 1 || selected[0] === "G";
        rr.onclick = () => {
          if (confirm("Se descarta la carta elegida y recibís una nueva. ¿Seguro?")) {
            send({ action: "reroll", card: selected[0] });
          }
        };
        actions.append(play, rr);
      }
    } else if (s.me.is_judge) {
      const win = node("button", "🏆 Elegir ganadora", "bigbtn");
      win.disabled = selectedSub === null;
      win.onclick = () => { send({ action: "pick_winner", submission: selectedSub }); selectedSub = null; };
      actions.append(win);
      if (selectedSub === null) actions.append(node("p", "Tocá la respuesta que más te gustó.", "hint"));
    } else {
      actions.append(node("p", "El juez está eligiendo…", "hint"));
    }
    board.append(actions);

    // Mano (solo en la fase de jugar, y no para el juez)
    if (s.state === "playing" && !s.me.is_judge) {
      const wrap = node("div", undefined, "handwrap");
      const count = node("div", undefined, "handcount");
      count.append(node("span", "Tus cartas:"), node("strong", String(s.me.hand.length)));

      const hand = node("div", undefined, "hand" + (s.me.has_played ? " locked" : ""));
      if (!s.me.has_played && (s.me.golden_left ?? 0) > 0) hand.append(goldenCardNode(pick));
      for (const c of s.me.hand) {
        const idx = selected.indexOf(c.id);
        const label = idx >= 0 && pick > 1 ? `${idx + 1}. ${c.text}` : c.text;
        hand.append(cardNode(label, "white" + (idx >= 0 ? " selected" : ""),
                             s.me.has_played ? null : () => toggle(c.id, pick)));
      }
      wrap.append(count, hand);
      board.append(wrap);
    }

    main.append(board);
  }

  function renderMain(s) {
    const main = $("main");
    const ae = document.activeElement;
    const keepFocus = !!ae && ae.id === "deck-code";
    const keepGolden = !!ae && ae.id === "golden-input";
    const caret = keepGolden ? [ae.selectionStart, ae.selectionEnd] : [0, 0];
    main.replaceChildren();
    main.className = (s.state === "lobby" || s.state === "finished") ? "panel" : "";

    if (s.state === "lobby") { renderLobby(main, s, keepFocus); return; }
    if (s.state === "finished") { renderFinished(main, s); return; }
    renderBoard(main, s);

    const g = $("golden-input");
    if (g && (focusGolden || keepGolden)) {
      g.focus();
      const [a, b] = focusGolden ? [g.value.length, g.value.length] : caret;
      g.setSelectionRange(a, b);
      focusGolden = false;
    }
  }

  function render(s) {
    const first = state === null;  // primer estado recibido (entrada o recarga)
    const justFinished = !first && s.state === "finished" && state.state !== "finished";
    trackScores(s);
    state = s;
    const ids = new Set(s.me.hand.map((c) => c.id));
    const goldenOk = s.state === "playing" && !s.me.is_judge && !s.me.has_played
                     && (s.me.golden_left ?? 0) > 0;
    selected = selected.filter((id) => ids.has(id) || (id === "G" && goldenOk));
    if ((s.me.golden_left ?? 0) <= 0) goldenText = "";  // ya la usó: se descarta el borrador
    if (s.state !== "judging" || !s.submissions.some((x) => x.id === selectedSub)) selectedSub = null;

    $("round-pill").textContent =
      s.state === "lobby" ? "Lobby" : s.state === "finished" ? "Partida terminada" : `Ronda ${s.round}`;
    $("goal-pill").hidden = s.state === "lobby";
    $("goal-pill").textContent = `A ${s.points_to_win} puntos`;

    renderResult(s, first);
    if (justFinished) {
      if ($("reveal").hidden) showPodium(s);  // terminó sin una última revelación (p. ej. se fueron jugadores)
      else podiumPending = true;              // se muestra cuando se cierre la revelación de la última ronda
    }
    if (pendingCelebrate.size && $("reveal").hidden) flushCelebrate();
    renderPlayers(s);
    renderControls(s);
    renderMain(s);
  }

  function connect() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${scheme}://${location.host}/ws/sala/{{ game.code }}/`);

    ws.onopen = () => {
      $("status").textContent = "Conectado ✅";
      clearInterval(pingTimer);
      pingTimer = setInterval(() => send({ action: "ping" }), 20000);
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "state") render(msg);
      else if (msg.type === "chat") addChat(msg.nick, msg.text);
      else if (msg.type === "error") showToast(msg.message);
    };
    ws.onclose = (e) => {
      clearInterval(pingTimer);
      if (e.code === 4403 || e.code === 4404) {  // sin reconexión: ya no pertenece a la sala
        $("status").textContent = e.code === 4404 ? "Ya no estás en esta sala" : "No pertenecés a esta sala";
        $("main").replaceChildren();
        $("players").replaceChildren();
        $("controls").replaceChildren();
        const a = node("a", "Volver al inicio", "btn");
        a.href = "{% url 'game:home' %}";
        $("main").append(a);
        return;
      }
      $("status").textContent = "Desconectado. Reintentando…";
      setTimeout(connect, 2000);
    };
  }
  connect();
</script>
{% endblock %}
