{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Importar mazo (JSON)</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.file }}
    <button>Importar</button>
  </form>
</div>
{% endblock %}
