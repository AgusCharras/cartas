<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 340 344" role="img" aria-label="Mascota de Cartas Arg: un ganso con corona y anteojos pixelados" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Líneas de energía -->
  <g stroke-linecap="round" fill="none">
    <path d="M62 78 L92 94" stroke="#6fd39a" stroke-width="9"/>
    <path d="M48 118 L84 122" stroke="#f6f3ec" stroke-width="9"/>
    <path d="M70 40 L88 62" stroke="#6fd39a" stroke-width="9"/>
  </g>

  <!-- Cuerpo y cuello -->
  <path d="M30 320 C 100 220, 125 160, 150 118 C 124 96, 134 52, 182 46
           C 226 40, 258 66, 254 100 C 252 118, 234 130, 214 130
           C 204 168, 198 236, 170 320 Z"
        fill="#f6f3ec" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
  <!-- Sombra del cuello -->
  <path d="M158 150 C 150 200, 132 250, 104 320 L 170 320 C 196 240, 204 180, 212 140 C 190 150, 172 152, 158 150 Z"
        fill="#dcd7cb" opacity=".75"/>

  <!-- Pico -->
  <path d="M232 76 C 268 70, 304 82, 326 102 C 300 110, 262 112, 236 108 Z"
        fill="#f5a623" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
  <path d="M236 108 C 262 112, 300 110, 326 102 C 312 126, 272 134, 240 124 Z"
        fill="#e07f00" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="276" cy="92" r="3.6" fill="#111"/>

  <!-- Anteojos pixelados -->
  <g fill="#111">
    <rect x="146" y="62" width="112" height="14"/>
    <rect x="132" y="62" width="16" height="10"/>
    <rect x="152" y="76" width="44" height="14"/>
    <rect x="160" y="90" width="28" height="10"/>
    <rect x="210" y="76" width="44" height="14"/>
    <rect x="218" y="90" width="28" height="10"/>
  </g>
  <g fill="#fff">
    <rect x="158" y="78" width="10" height="5"/>
    <rect x="168" y="84" width="5" height="5"/>
    <rect x="216" y="78" width="10" height="5"/>
    <rect x="226" y="84" width="5" height="5"/>
  </g>

  <!-- Corona -->
  <g transform="rotate(-9 190 30)">
    <path d="M150 52 L146 14 L170 32 L190 6 L210 32 L234 14 L230 52 Z"
          fill="#f5c542" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <path d="M152 44 L228 44" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <circle cx="146" cy="12" r="6" fill="#f5c542" stroke="#111" stroke-width="4"/>
    <circle cx="190" cy="4" r="6" fill="#f5c542" stroke="#111" stroke-width="4"/>
    <circle cx="234" cy="12" r="6" fill="#f5c542" stroke="#111" stroke-width="4"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>